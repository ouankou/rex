name: Weekly RISC-V64 CI

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-riscv64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-riscv64:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Set up QEMU (riscv64)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: riscv64

    - name: Build and test (riscv64 via QEMU)
      env:
        LLVM_VERSION: 21
      run: |
        set -euo pipefail
        docker run --rm --platform=linux/riscv64 \
          -v "${GITHUB_WORKSPACE}:/work" \
          -w /work \
          -e LLVM_VERSION="${LLVM_VERSION}" \
          ghcr.io/${{ github.repository_owner }}/rex:base \
          bash -lc '
            set -euo pipefail
            export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:${PATH}"
            export CMAKE_PREFIX_PATH="/usr/lib/llvm-${LLVM_VERSION}"
            export LLVM_DIR="/usr/lib/llvm-${LLVM_VERSION}"
            export CC="clang-${LLVM_VERSION}"
            export CXX="clang++-${LLVM_VERSION}"
            export FC="flang-${LLVM_VERSION}"

            JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
            export LD_LIBRARY_PATH="/usr/lib/llvm-${LLVM_VERSION}/lib:${JAVA_HOME}/lib/server:${LD_LIBRARY_PATH:-}"

            git config --global --add safe.directory /work

            CTEST_JOBS="$(nproc)"

            ./build-rex.sh /work/rex_install Debug

            ctest --test-dir build \
              -R "rex|astInterface|testQuery|fortran|f90|f03|OMPVV_5_0_|OMPLOWERING_RODINIA_" \
              --output-on-failure \
              -j"${CTEST_JOBS}"
          '
