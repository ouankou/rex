name: Weekly Memory CI

on:
  schedule:
    # Every Friday at 00:18 UTC
    - cron: "18 0 * * 5"
  workflow_dispatch:

# Jobs run in parallel to stay within GitHub's 6-hour per-job limit.
concurrency:
  group: weekly-memory-${{ github.ref }}
  cancel-in-progress: false

env:
  LLVM_VERSION: 22
  # EXT-OPENMP-TOPOLOGY-IDS: docs/codebase-audit/external-exceptions.md.
  # Use libomp's documented Linux topology reader in every native CI profile.
  KMP_TOPOLOGY_METHOD: cpuinfo

jobs:
  full-tests:
    runs-on: ubuntu-26.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    # NOTE: Ubuntu 26.04 ships antlr4-cpp-runtime v4.10; use a matching ANTLR4 CLI while keeping the action runtime current.
    - uses: StoneMoe/setup-antlr4@v4.13.2
      with:
        download_url: https://www.antlr.org/download/antlr-4.10.1-complete.jar

    - name: Install dependencies
      run: scripts/ci-install-deps native "${{ env.LLVM_VERSION }}"

    - name: Configure (Debug)
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        export CC="clang-${{ env.LLVM_VERSION }}"
        export CXX="clang++-${{ env.LLVM_VERSION }}"
        export FC="flang-${{ env.LLVM_VERSION }}"
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          "-DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/rex_install" \
          -DENABLE-C=ON \
          -DENABLE-FORTRAN=ON \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build
      run: cmake --build build -j"$(nproc)"

    - name: Run full tests
      run: |
        set -o pipefail
        ctest --test-dir build --no-tests=error -j"$(nproc)" --output-on-failure --output-junit ctest.junit.xml 2>&1 | tee ctest-full.log

    - name: Upload full test log
      if: ${{ always() && !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: full-tests-log
        path: |
          ctest-full.log
          ctest.junit.xml
        if-no-files-found: warn

  memcheck:
    runs-on: ubuntu-26.04

    env:
      REX_MEMCHECK_CTEST_MAX_JOBS: 8

    strategy:
      fail-fast: false
      matrix:
        # Stable name-hash shards keep the complete MemCheck selection below
        # GitHub's six-hour job limit. Dependencies and fixtures are added after
        # sharding, so support tests may repeat across shards.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    - uses: StoneMoe/setup-antlr4@v4.13.2
      with:
        download_url: https://www.antlr.org/download/antlr-4.10.1-complete.jar

    - name: Install dependencies
      run: |
        scripts/ci-install-deps native "${{ env.LLVM_VERSION }}"
        # EXT-VALGRIND-MULTICALL-ENV: docs/codebase-audit/external-exceptions.md.
        # Older uutils env rejects Valgrind's synthetic interpreter argv[0].
        # Use Ubuntu's GNU alternative; CMake checks traced env dispatch
        # before enabling the MemCheck scripts.
        sudo apt-get install -y --allow-remove-essential \
          coreutils-from-gnu \
          coreutils-from-uutils- \
          ubuntu-dbgsym-keyring
        /usr/bin/env --version

    - name: Install exact utility debug symbols
      # EXT-GREP-PATTERN-ARRAY / EXT-MAWK-BUILTIN-ARENA /
      # EXT-COREUTILS-MKTEMP-FILENAMES / EXT-BASH-TERMINAL-COMMAND /
      # EXT-GIT-INIT-CHDIR-LIST:
      # docs/codebase-audit/external-exceptions.md.
      run: |
        # Ubuntu's signed debug archive provides persistent package companions.
        # Pin them to installed utility versions; a mismatch is a setup failure.
        sudo tee /etc/apt/sources.list.d/rex-ddebs.sources > /dev/null <<'SOURCES'
        Types: deb
        URIs: http://ddebs.ubuntu.com/
        Suites: resolute resolute-updates
        Components: main
        Signed-By: /usr/share/keyrings/ubuntu-dbgsym-keyring.gpg
        SOURCES
        sudo apt-get update
        packages=()
        for package in grep gnu-coreutils mawk bash git; do
          version=$(dpkg-query --show --showformat='${Version}' "${package}")
          packages+=("${package}-dbgsym=${version}")
        done
        sudo apt-get install -y "${packages[@]}"
        python3 scripts/ci-verify-memcheck-symbols \
          /usr/bin/grep /usr/bin/mktemp /usr/bin/awk /usr/bin/bash /usr/bin/git > memcheck-symbols.json

    - name: Configure (Debug + Valgrind)
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        export CC="clang-${{ env.LLVM_VERSION }}"
        export CXX="clang++-${{ env.LLVM_VERSION }}"
        export FC="flang-${{ env.LLVM_VERSION }}"
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          "-DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/rex_install" \
          -DENABLE-C=ON \
          -DENABLE-FORTRAN=ON \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DREX_EXTENDED_TEST_TIMEOUTS=ON \
          -DWITH-VALGRIND=/usr

    - name: Build
      run: |
        BUILD_JOBS="$(nproc)"
        if (( BUILD_JOBS > REX_MEMCHECK_CTEST_MAX_JOBS )); then
          BUILD_JOBS="${REX_MEMCHECK_CTEST_MAX_JOBS}"
        fi
        echo "Building with ${BUILD_JOBS} workers"
        cmake --build build -j"${BUILD_JOBS}"

    - name: Run memcheck on CI selection
      env:
        ROSE_TEST_TIMEOUT_SCALE: "24"
      run: |
        set -o pipefail
        CTEST_JOBS="$(nproc)"
        if (( CTEST_JOBS > REX_MEMCHECK_CTEST_MAX_JOBS )); then
          CTEST_JOBS="${REX_MEMCHECK_CTEST_MAX_JOBS}"
        fi
        echo "Running ${CTEST_JOBS} MemCheck workers"
        python3 scripts/run_ctest_name_set.py \
          --test-dir build \
          --include-regex "astInterface|testQuery|rex|Cxx_tests_test_multiple_files_2" \
          --exclude-label death \
          --shard-index "${{ matrix.shard }}" \
          --shard-count 8 \
          --jobs "${CTEST_JOBS}" \
          --memcheck \
          --timeout 19800 \
          2>&1 | tee ctest-memcheck.log

    - name: Upload memcheck logs
      if: ${{ always() && !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: memcheck-logs-${{ matrix.shard }}-of-8
        path: |
          ctest-memcheck.log
          memcheck-symbols.json
          build/Testing/TAG
          build/Testing/*/DynamicAnalysis.xml
          build/Testing/Temporary/MemoryChecker.*.log
          build/Testing/Temporary/LastDynamicAnalysis*.log
          build/Testing/Temporary/LastTest.log
          build/Testing/rex-name-set-*/
        if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-26.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    - uses: StoneMoe/setup-antlr4@v4.13.2
      with:
        download_url: https://www.antlr.org/download/antlr-4.10.1-complete.jar

    - name: Install dependencies
      run: scripts/ci-install-deps native "${{ env.LLVM_VERSION }}"

    - name: Configure (Debug + Sanitizers)
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        export CC="clang-${{ env.LLVM_VERSION }}"
        export CXX="clang++-${{ env.LLVM_VERSION }}"
        export FC="flang-${{ env.LLVM_VERSION }}"
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          "-DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/rex_install" \
          -DENABLE-C=ON \
          -DENABLE-FORTRAN=ON \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DENABLE-SANITIZER=ON \
          -DROSE_SANITIZERS="address;leak;undefined"

    - name: Build with sanitizers
      run: cmake --build build -j"$(nproc)"

    - name: Run sanitizer on CI selection
      env:
        ASAN_OPTIONS: halt_on_error=1
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/rex-suppressions-for-lsan:halt_on_error=1
        ROSE_TEST_TIMEOUT_SCALE: "4"
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        set -o pipefail
        python3 scripts/run_ctest_name_set.py \
          --test-dir build --include-regex 'astInterface|testQuery|rex' \
          --exclude-label death --jobs "$(nproc)" --timeout 6000 \
          2>&1 | tee ctest-sanitizer.log

    - name: Upload sanitizer log
      if: ${{ always() && !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: sanitizer-log
        path: |
          ctest-sanitizer.log
          build/Testing/rex-name-set-*/
          build/Testing/Temporary/LastTest.log
        if-no-files-found: warn
