name: Weekly Memory CI

on:
  schedule:
    # Every Friday at 00:00 UTC
    - cron: "0 0 * * 5"
  workflow_dispatch:

# Jobs run in parallel to stay within GitHub's 6-hour per-job limit.
concurrency:
  group: weekly-memory-${{ github.ref }}
  cancel-in-progress: false

env:
  LLVM_VERSION: 22

jobs:
  full-tests:
    runs-on: ubuntu-26.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    # NOTE: Ubuntu 26.04 ships antlr4-cpp-runtime v4.10; use a matching ANTLR4 CLI while keeping the action runtime current.
    - uses: StoneMoe/setup-antlr4@v4.13.2
      with:
        download_url: https://www.antlr.org/download/antlr-4.10.1-complete.jar

    - name: Install dependencies
      run: scripts/ci-install-deps native "${{ env.LLVM_VERSION }}"

    - name: Configure (Debug)
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        export CC="clang-${{ env.LLVM_VERSION }}"
        export CXX="clang++-${{ env.LLVM_VERSION }}"
        export FC="flang-${{ env.LLVM_VERSION }}"
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          "-DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/rex_install" \
          -DENABLE-C=ON \
          -DENABLE-FORTRAN=ON \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build
      run: cmake --build build -j"$(nproc)"

    - name: Run full tests
      run: |
        set +e
        ctest --test-dir build --no-tests=error -j"$(nproc)" --output-on-failure --output-junit ctest.junit.xml 2>&1 | tee ctest-full.log
        ctest_status=${PIPESTATUS[0]}
        echo "${ctest_status}" > ctest_exit_code.txt

    - name: Upload full test log
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: full-tests-log
        path: |
          ctest-full.log
          ctest.junit.xml
        if-no-files-found: warn

    - name: Fail if full tests failed
      run: |
        exit "$(cat ctest_exit_code.txt)"

  memcheck:
    runs-on: ubuntu-26.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    - uses: StoneMoe/setup-antlr4@v4.13.2
      with:
        download_url: https://www.antlr.org/download/antlr-4.10.1-complete.jar

    - name: Install dependencies
      run: |
        scripts/ci-install-deps native "${{ env.LLVM_VERSION }}"
        sudo apt-get install -y valgrind

    - name: Configure (Debug + Valgrind)
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        export CC="clang-${{ env.LLVM_VERSION }}"
        export CXX="clang++-${{ env.LLVM_VERSION }}"
        export FC="flang-${{ env.LLVM_VERSION }}"
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          "-DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/rex_install" \
          -DENABLE-C=ON \
          -DENABLE-FORTRAN=ON \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DWITH-VALGRIND=/usr

    - name: Build
      run: cmake --build build -j"$(nproc)"

    - name: Run memcheck on CI selection
      env:
        ROSE_TEST_TIMEOUT_SCALE: "4"
      run: |
        set -o pipefail
        ctest --test-dir build --no-tests=error -T memcheck -R "astInterface|testQuery|rex" -LE death -j"$(nproc)" --timeout 5400 --output-on-failure 2>&1 | tee ctest-memcheck.log

    - name: Upload memcheck logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: memcheck-logs
        path: |
          ctest-memcheck.log
          build/Testing/Temporary/MemoryChecker.*.log
          build/Testing/Temporary/LastTest.log
        if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-26.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    - uses: StoneMoe/setup-antlr4@v4.13.2
      with:
        download_url: https://www.antlr.org/download/antlr-4.10.1-complete.jar

    - name: Install dependencies
      run: scripts/ci-install-deps native "${{ env.LLVM_VERSION }}"

    - name: Configure (Debug + Sanitizers)
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        export CC="clang-${{ env.LLVM_VERSION }}"
        export CXX="clang++-${{ env.LLVM_VERSION }}"
        export FC="flang-${{ env.LLVM_VERSION }}"
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          "-DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/rex_install" \
          -DENABLE-C=ON \
          -DENABLE-FORTRAN=ON \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DENABLE-SANITIZER=ON \
          -DROSE_SANITIZERS="address;leak;undefined"

    - name: Build
      run: cmake --build build -j"$(nproc)"

    - name: Run sanitizer on CI selection
      env:
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/rex-suppressions-for-lsan
      run: |
        set -o pipefail
        ctest --test-dir build --no-tests=error -R "astInterface|testQuery|rex" -LE death -j"$(nproc)" --output-on-failure 2>&1 | tee ctest-sanitizer.log

    - name: Upload sanitizer log
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: sanitizer-log
        path: ctest-sanitizer.log
        if-no-files-found: warn
