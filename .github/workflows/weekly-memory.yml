name: Weekly Memory CI

on:
  schedule:
    # Every Friday at 00:00 UTC
    - cron: "0 0 * * 5"
  workflow_dispatch:

# Jobs run in parallel to stay within GitHub's 6-hour per-job limit.
concurrency:
  group: weekly-memory-${{ github.ref }}
  cancel-in-progress: false

env:
  LLVM_VERSION: 22

jobs:
  full-tests:
    runs-on: ubuntu-26.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    # NOTE: Ubuntu 26.04 ships antlr4-cpp-runtime v4.10; use a matching ANTLR4 CLI while keeping the action runtime current.
    - uses: StoneMoe/setup-antlr4@v4.13.2
      with:
        download_url: https://www.antlr.org/download/antlr-4.10.1-complete.jar

    - name: Install dependencies
      run: scripts/ci-install-deps native "${{ env.LLVM_VERSION }}"

    - name: Configure (Debug)
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        export CC="clang-${{ env.LLVM_VERSION }}"
        export CXX="clang++-${{ env.LLVM_VERSION }}"
        export FC="flang-${{ env.LLVM_VERSION }}"
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          "-DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/rex_install" \
          -DENABLE-C=ON \
          -DENABLE-FORTRAN=ON \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build
      run: cmake --build build -j"$(nproc)"

    - name: Run full tests
      env:
        ROSE_TEST_TIMEOUT_SCALE: "2"
      run: |
        set -o pipefail
        ctest --test-dir build --no-tests=error -j"$(nproc)" --timeout 3000 --output-on-failure --output-junit ctest.junit.xml 2>&1 | tee ctest-full.log

    - name: Upload full test log
      if: ${{ always() && !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: full-tests-log
        path: |
          ctest-full.log
          ctest.junit.xml
        if-no-files-found: warn

  memcheck:
    runs-on: ubuntu-26.04

    env:
      REX_MEMCHECK_CTEST_MAX_JOBS: 8

    strategy:
      fail-fast: false
      matrix:
        # Stable name-hash shards keep the complete MemCheck selection below
        # GitHub's six-hour job limit. Dependencies and fixtures are added after
        # sharding, so support tests may repeat across shards.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    - uses: StoneMoe/setup-antlr4@v4.13.2
      with:
        download_url: https://www.antlr.org/download/antlr-4.10.1-complete.jar

    - name: Install dependencies
      run: |
        scripts/ci-install-deps native "${{ env.LLVM_VERSION }}"
        # Ubuntu 26.04 selects the uutils multicall implementation of env(1).
        # Valgrind gives a traced shebang interpreter its synthetic argv[0],
        # which a multicall binary interprets as an unknown utility name before
        # the script can run.  Select Ubuntu's standalone GNU coreutils
        # alternative atomically so nested executable scripts stay inside the
        # MemCheck child-tracing boundary.
        sudo apt-get install -y --allow-remove-essential \
          coreutils-from-gnu \
          coreutils-from-uutils-
        env_version="$(/usr/bin/env --version 2>&1)"
        if [[ "${env_version}" != *"GNU coreutils"* ]]; then
          echo "MemCheck requires standalone GNU /usr/bin/env, got: ${env_version}" >&2
          exit 1
        fi

    - name: Configure (Debug + Valgrind)
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        export CC="clang-${{ env.LLVM_VERSION }}"
        export CXX="clang++-${{ env.LLVM_VERSION }}"
        export FC="flang-${{ env.LLVM_VERSION }}"
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          "-DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/rex_install" \
          -DENABLE-C=ON \
          -DENABLE-FORTRAN=ON \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DREX_EXTENDED_TEST_TIMEOUTS=ON \
          -DWITH-VALGRIND=/usr

    - name: Build
      run: |
        BUILD_JOBS="$(nproc)"
        if (( BUILD_JOBS > REX_MEMCHECK_CTEST_MAX_JOBS )); then
          BUILD_JOBS="${REX_MEMCHECK_CTEST_MAX_JOBS}"
        fi
        echo "Building with ${BUILD_JOBS} workers"
        cmake --build build -j"${BUILD_JOBS}"

    - name: Run memcheck on CI selection
      env:
        ROSE_TEST_TIMEOUT_SCALE: "24"
      run: |
        set -o pipefail
        CTEST_JOBS="$(nproc)"
        if (( CTEST_JOBS > REX_MEMCHECK_CTEST_MAX_JOBS )); then
          CTEST_JOBS="${REX_MEMCHECK_CTEST_MAX_JOBS}"
        fi
        echo "Running ${CTEST_JOBS} MemCheck workers"
        python3 scripts/run_ctest_name_set.py \
          --test-dir build \
          --include-regex "astInterface|testQuery|rex|Cxx_tests_test_multiple_files_2" \
          --exclude-label death \
          --shard-index "${{ matrix.shard }}" \
          --shard-count 8 \
          --jobs "${CTEST_JOBS}" \
          --memcheck \
          --timeout 19800 \
          2>&1 | tee ctest-memcheck.log

    - name: Upload memcheck logs
      if: ${{ always() && !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: memcheck-logs-${{ matrix.shard }}-of-8
        path: |
          ctest-memcheck.log
          build/Testing/Temporary/MemoryChecker.*.log
          build/Testing/Temporary/LastTest.log
        if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-26.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    - uses: StoneMoe/setup-antlr4@v4.13.2
      with:
        download_url: https://www.antlr.org/download/antlr-4.10.1-complete.jar

    - name: Install dependencies
      run: scripts/ci-install-deps native "${{ env.LLVM_VERSION }}"

    - name: Configure (Debug + Sanitizers)
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        export CC="clang-${{ env.LLVM_VERSION }}"
        export CXX="clang++-${{ env.LLVM_VERSION }}"
        export FC="flang-${{ env.LLVM_VERSION }}"
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          "-DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/rex_install" \
          -DENABLE-C=ON \
          -DENABLE-FORTRAN=ON \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DENABLE-SANITIZER=ON \
          -DROSE_SANITIZERS="address;leak;undefined"

    - name: Build
      run: cmake --build build -j"$(nproc)"

    - name: Run sanitizer on CI selection
      env:
        ASAN_OPTIONS: halt_on_error=1
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/rex-suppressions-for-lsan:halt_on_error=1
        ROSE_TEST_TIMEOUT_SCALE: "4"
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        set -o pipefail
        ctest --test-dir build --no-tests=error -R "astInterface|testQuery|rex" -LE death -j"$(nproc)" --timeout 6000 --output-on-failure 2>&1 | tee ctest-sanitizer.log

    - name: Upload sanitizer log
      if: ${{ always() && !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: sanitizer-log
        path: ctest-sanitizer.log
        if-no-files-found: warn
