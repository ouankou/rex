name: Weekly Memory CI

on:
  schedule:
    # Every Friday at 00:00 UTC
    - cron: "0 0 * * 5"
  workflow_dispatch:

# Jobs run in parallel to stay within GitHub's 6-hour per-job limit.
concurrency:
  group: weekly-memory-${{ github.ref }}
  cancel-in-progress: false

env:
  LLVM_VERSION: 22

jobs:
  full-tests:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        persist-credentials: false

    # NOTE: Ubuntu 24.04 ships antlr4 v4.9 but antlr4-cpp-runtime v4.10, which are API-incompatible; manually install the matching antlr4 v4.10.
    - uses: StoneMoe/setup-antlr4@v4.10.1

    - name: Add LLVM apt repository
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc > /dev/null
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bison \
          build-essential \
          cmake \
          clang-${LLVM_VERSION} \
          curl \
          flang-${LLVM_VERSION} \
          flex \
          g++ \
          gdb \
          ghostscript \
          git \
          graphviz \
          libantlr4-runtime-dev \
          libclang-${LLVM_VERSION}-dev \
          libclang-cpp${LLVM_VERSION}-dev \
          libhpdf-dev \
          libtool \
          libomp-${LLVM_VERSION}-dev \
          llvm-${LLVM_VERSION} \
          llvm-${LLVM_VERSION}-dev \
          openjdk-25-jdk \
          pkg-config

    - name: Configure (Debug)
      env:
        PATH: /usr/lib/llvm-${{ env.LLVM_VERSION }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        LD_LIBRARY_PATH: /usr/lib/llvm-${{ env.LLVM_VERSION }}/lib:/usr/lib/jvm/java-25-openjdk-amd64/lib/server
        CMAKE_PREFIX_PATH: /usr/lib/llvm-${{ env.LLVM_VERSION }}
        LLVM_DIR: /usr/lib/llvm-${{ env.LLVM_VERSION }}
        CC: clang-${{ env.LLVM_VERSION }}
        CXX: clang++-${{ env.LLVM_VERSION }}
        FC: flang-${{ env.LLVM_VERSION }}
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/rex_install \
          -DENABLE-C=ON \
          -DENABLE-FORTRAN=ON \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build
      run: cmake --build build -j"$(nproc)"

    - name: Run full tests
      run: |
        set +e
        ctest --test-dir build -j"$(nproc)" --output-on-failure --output-junit ctest.junit.xml 2>&1 | tee ctest-full.log
        ctest_status=${PIPESTATUS[0]}
        echo "${ctest_status}" > ctest_exit_code.txt

    - name: Upload full test log
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: full-tests-log
        path: |
          ctest-full.log
          ctest.junit.xml
        if-no-files-found: warn

    - name: Fail if full tests failed
      run: |
        exit "$(cat ctest_exit_code.txt)"

  memcheck:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        persist-credentials: false

    - uses: StoneMoe/setup-antlr4@v4.10.1

    - name: Add LLVM apt repository
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc > /dev/null
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bison \
          build-essential \
          cmake \
          clang-${LLVM_VERSION} \
          curl \
          flang-${LLVM_VERSION} \
          flex \
          g++ \
          gdb \
          ghostscript \
          git \
          graphviz \
          libantlr4-runtime-dev \
          libclang-${LLVM_VERSION}-dev \
          libclang-cpp${LLVM_VERSION}-dev \
          libhpdf-dev \
          libtool \
          libomp-${LLVM_VERSION}-dev \
          llvm-${LLVM_VERSION} \
          llvm-${LLVM_VERSION}-dev \
          openjdk-25-jdk \
          pkg-config \
          valgrind

    - name: Configure (Debug + Valgrind)
      env:
        PATH: /usr/lib/llvm-${{ env.LLVM_VERSION }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        LD_LIBRARY_PATH: /usr/lib/llvm-${{ env.LLVM_VERSION }}/lib:/usr/lib/jvm/java-25-openjdk-amd64/lib/server
        CMAKE_PREFIX_PATH: /usr/lib/llvm-${{ env.LLVM_VERSION }}
        LLVM_DIR: /usr/lib/llvm-${{ env.LLVM_VERSION }}
        CC: clang-${{ env.LLVM_VERSION }}
        CXX: clang++-${{ env.LLVM_VERSION }}
        FC: flang-${{ env.LLVM_VERSION }}
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/rex_install \
          -DENABLE-C=ON \
          -DENABLE-FORTRAN=ON \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DWITH-VALGRIND=/usr

    - name: Build
      run: cmake --build build -j"$(nproc)"

    - name: Run memcheck on CI selection
      env:
        ROSE_TEST_TIMEOUT_SCALE: "4"
      run: |
        set -o pipefail
        ctest --test-dir build -T memcheck -R "astInterface|testQuery|rex" -LE death -j"$(nproc)" --timeout 5400 --output-on-failure 2>&1 | tee ctest-memcheck.log

    - name: Upload memcheck logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: memcheck-logs
        path: |
          ctest-memcheck.log
          build/Testing/Temporary/MemoryChecker.*.log
          build/Testing/Temporary/LastTest.log
        if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        persist-credentials: false

    - uses: StoneMoe/setup-antlr4@v4.10.1

    - name: Add LLVM apt repository
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc > /dev/null
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bison \
          build-essential \
          cmake \
          clang-${LLVM_VERSION} \
          curl \
          flang-${LLVM_VERSION} \
          flex \
          g++ \
          gdb \
          ghostscript \
          git \
          graphviz \
          libantlr4-runtime-dev \
          libclang-${LLVM_VERSION}-dev \
          libclang-cpp${LLVM_VERSION}-dev \
          libhpdf-dev \
          libtool \
          libomp-${LLVM_VERSION}-dev \
          llvm-${LLVM_VERSION} \
          llvm-${LLVM_VERSION}-dev \
          openjdk-25-jdk \
          pkg-config

    - name: Configure (Debug + Sanitizers)
      env:
        PATH: /usr/lib/llvm-${{ env.LLVM_VERSION }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        LD_LIBRARY_PATH: /usr/lib/llvm-${{ env.LLVM_VERSION }}/lib:/usr/lib/jvm/java-25-openjdk-amd64/lib/server
        CMAKE_PREFIX_PATH: /usr/lib/llvm-${{ env.LLVM_VERSION }}
        LLVM_DIR: /usr/lib/llvm-${{ env.LLVM_VERSION }}
        CC: clang-${{ env.LLVM_VERSION }}
        CXX: clang++-${{ env.LLVM_VERSION }}
        FC: flang-${{ env.LLVM_VERSION }}
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/rex_install \
          -DENABLE-C=ON \
          -DENABLE-FORTRAN=ON \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DENABLE-SANITIZER=ON \
          -DROSE_SANITIZERS="address;leak;undefined"

    - name: Build
      run: cmake --build build -j"$(nproc)"

    - name: Run sanitizer on CI selection
      env:
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/rex-suppressions-for-lsan
      run: |
        set -o pipefail
        ctest --test-dir build -R "astInterface|testQuery|rex" -LE death -j"$(nproc)" --output-on-failure 2>&1 | tee ctest-sanitizer.log

    - name: Upload sanitizer log
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: sanitizer-log
        path: ctest-sanitizer.log
        if-no-files-found: warn
