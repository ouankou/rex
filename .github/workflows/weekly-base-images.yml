name: Weekly Base Images

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

concurrency:
  group: weekly-base-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
  LOCAL_IMAGE_REPO: rex-local

jobs:
  build:
    name: Build ${{ matrix.arch }} base image
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, riscv64, loong64]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: ${{ matrix.arch != 'amd64' && (matrix.arch != 'arm64' || env.ACT) }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.arch }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ci/docker/rex-base.Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: ${{ !env.ACT }}
          load: ${{ env.ACT != '' }}
          provenance: false
          tags: ${{ env.ACT && format('{0}:base-{1}-local', env.LOCAL_IMAGE_REPO, matrix.arch) || format('{0}:base-{1}-{2}', env.IMAGE_REPO, github.sha, matrix.arch) }}
          build-args: BASE_IMAGE=${{ matrix.arch == 'loong64' && 'ghcr.io/loong64/debian:sid' || 'debian:sid' }}

  publish:
    name: Publish base manifest
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      packages: write

    steps:
      - if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifest
        if: ${{ !env.ACT }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:base" \
            -t "${IMAGE_REPO}:base-${GITHUB_SHA}" \
            "${IMAGE_REPO}:base-${GITHUB_SHA}-amd64" \
            "${IMAGE_REPO}:base-${GITHUB_SHA}-arm64" \
            "${IMAGE_REPO}:base-${GITHUB_SHA}-riscv64" \
            "${IMAGE_REPO}:base-${GITHUB_SHA}-loong64"
