name: Weekly Base Images

on:
  schedule:
    # Every Wednesday at 00:00 UTC
    - cron: "0 0 * * 3"
  workflow_dispatch:

concurrency:
  group: weekly-base-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-images:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: bash

    env:
      LLVM_VERSION: 22
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
      BASE_TAG: base
      LOCAL_IMAGE_REPO: rex-local

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up QEMU (arm64, riscv64, loong64)
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64,riscv64,loong64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      if: ${{ !env.ACT }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push base image (amd64)
      if: ${{ !env.ACT }}
      id: build-amd64
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-amd64.Dockerfile
        platforms: linux/amd64
        build-args: |
          LLVM_VERSION=${{ env.LLVM_VERSION }}
        pull: true
        provenance: false
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build base image locally (amd64)
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v7
      with:
        builder: default
        context: .
        file: ci/docker/rex-amd64.Dockerfile
        platforms: linux/amd64
        build-args: |
          LLVM_VERSION=${{ env.LLVM_VERSION }}
        pull: true
        provenance: false
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:base-amd64-local

    - name: Build and push base image (arm64)
      if: ${{ !env.ACT }}
      id: build-arm64
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-arm64.Dockerfile
        platforms: linux/arm64
        build-args: |
          LLVM_VERSION=${{ env.LLVM_VERSION }}
        pull: true
        provenance: false
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build base image locally (arm64)
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v7
      with:
        builder: default
        context: .
        file: ci/docker/rex-arm64.Dockerfile
        platforms: linux/arm64
        build-args: |
          LLVM_VERSION=${{ env.LLVM_VERSION }}
        pull: true
        provenance: false
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:base-arm64-local

    - name: Build and push base image (riscv64)
      if: ${{ !env.ACT }}
      id: build-riscv64
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-riscv64.Dockerfile
        platforms: linux/riscv64
        build-args: |
          LLVM_VERSION=${{ env.LLVM_VERSION }}
        pull: true
        provenance: false
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build base image locally (riscv64)
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v7
      with:
        builder: default
        context: .
        file: ci/docker/rex-riscv64.Dockerfile
        platforms: linux/riscv64
        build-args: |
          LLVM_VERSION=${{ env.LLVM_VERSION }}
        pull: true
        provenance: false
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:base-riscv64-local

    - name: Build and push base image (loong64)
      if: ${{ !env.ACT }}
      id: build-loong64
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-loongarch64.Dockerfile
        platforms: linux/loong64
        build-args: |
          LLVM_VERSION=${{ env.LLVM_VERSION }}
        pull: true
        provenance: false
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build base image locally (loong64)
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v7
      with:
        builder: default
        context: .
        file: ci/docker/rex-loongarch64.Dockerfile
        platforms: linux/loong64
        build-args: |
          LLVM_VERSION=${{ env.LLVM_VERSION }}
        pull: true
        provenance: false
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:base-loong64-local

    - name: Publish multi-arch manifest (base tag only)
      if: ${{ !env.ACT }}
      run: |
        set -euo pipefail
        docker buildx imagetools create \
          -t "${IMAGE_REPO}:${BASE_TAG}" \
          "${IMAGE_REPO}@${{ steps.build-amd64.outputs.digest }}" \
          "${IMAGE_REPO}@${{ steps.build-arm64.outputs.digest }}" \
          "${IMAGE_REPO}@${{ steps.build-riscv64.outputs.digest }}" \
          "${IMAGE_REPO}@${{ steps.build-loong64.outputs.digest }}"
        docker buildx imagetools inspect "${IMAGE_REPO}:${BASE_TAG}"

    - name: Verify local base images
      if: ${{ env.ACT }}
      run: |
        set -euo pipefail
        declare -A platforms=(
          [amd64]=linux/amd64
          [arm64]=linux/arm64
          [riscv64]=linux/riscv64
          [loong64]=linux/loong64
        )

        for arch in amd64 arm64 riscv64 loong64; do
          docker run --rm --platform="${platforms[$arch]}" \
            -e LLVM_VERSION="${LLVM_VERSION}" \
            "${LOCAL_IMAGE_REPO}:base-${arch}-local" \
            bash -lc '
              set -euo pipefail
              javac -version
              dpkg-query -W openjdk-25-jdk-headless antlr4 clang-${LLVM_VERSION} lld-${LLVM_VERSION} mold gdb
            '
        done
