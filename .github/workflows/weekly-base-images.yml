name: Weekly Base Images

on:
  schedule:
    # Every Wednesday at 00:00 UTC
    - cron: "0 0 * * 3"
  workflow_dispatch:

concurrency:
  group: weekly-base-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: bash

    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
      BASE_TAG: base

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up QEMU (riscv64, loong64)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: riscv64,loong64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push base image (riscv64)
      id: build-riscv64
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ci/docker/rex-riscv64.Dockerfile
        platforms: linux/riscv64
        tags: ${{ env.IMAGE_REPO }}
        pull: true
        provenance: false
        outputs: type=image,push-by-digest=true,name-canonical=true,push=true

    - name: Build and push base image (loong64)
      id: build-loong64
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ci/docker/rex-loongarch64.Dockerfile
        platforms: linux/loong64
        tags: ${{ env.IMAGE_REPO }}
        pull: true
        provenance: false
        outputs: type=image,push-by-digest=true,name-canonical=true,push=true

    - name: Publish multi-arch manifest (base tag only)
      run: |
        set -euo pipefail
        docker buildx imagetools create \
          -t "${IMAGE_REPO}:${BASE_TAG}" \
          "${IMAGE_REPO}@${{ steps.build-riscv64.outputs.digest }}" \
          "${IMAGE_REPO}@${{ steps.build-loong64.outputs.digest }}"
        docker buildx imagetools inspect "${IMAGE_REPO}:${BASE_TAG}"
