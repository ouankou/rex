name: Publish Docs

on:
  schedule:
    # Every Thursday at 00:00 UTC
    - cron: "0 0 * * 4"
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: 22
  DOCS_SITE_ARTIFACT: docs-site
  DOCS_BUILD_OUTPUT_DIR: _site
  REX_WASM_ARTIFACT: rex-wasm-dist
  PAGES_SITE_DIR: pages-site
  ARTIFACT_RETENTION_DAYS: 90

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: scripts/ci-install-deps docs

      - name: Install ANTLR4 tool (4.10.1)
        run: |
          set -euo pipefail
          mkdir -p .tools/antlr4
          curl -L https://www.antlr.org/download/antlr-4.10.1-complete.jar \
            -o .tools/antlr4/antlr-4.10.1-complete.jar
          cat > .tools/antlr4/antlr4 <<'SH'
          #!/usr/bin/env bash
          exec java -jar "$(dirname "$0")/antlr-4.10.1-complete.jar" "$@"
          SH
          chmod +x .tools/antlr4/antlr4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build docs
        run: |
          source scripts/ci-llvm-env "${LLVM_VERSION}"
          export CC="clang-${LLVM_VERSION}"
          export CXX="clang++-${LLVM_VERSION}"
          export DOCS_ANTLR4_EXECUTABLE="${GITHUB_WORKSPACE}/.tools/antlr4/antlr4"
          export DOCS_JOBS=32
          bash scripts/ci-docs-build

      - name: Upload docs site artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DOCS_SITE_ARTIFACT }}
          path: ${{ env.DOCS_BUILD_OUTPUT_DIR }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          overwrite: true

  rex-wasm:
    name: Build & Test WASM
    uses: ./.github/workflows/rex-wasm-build.yml
    with:
      upload-artifact: true

  deploy:
    name: Deploy Full Static Site
    runs-on: ubuntu-26.04
    needs: [build, rex-wasm]
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download docs site artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DOCS_SITE_ARTIFACT }}
          path: ${{ env.DOCS_SITE_ARTIFACT }}

      - name: Download REX WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REX_WASM_ARTIFACT }}
          path: ${{ env.REX_WASM_ARTIFACT }}

      - name: Assemble GitHub Pages site
        env:
          PAGES_WASM_DIR: ${{ env.REX_WASM_ARTIFACT }}
          PAGES_DOCS_DIR: ${{ env.DOCS_SITE_ARTIFACT }}
          PAGES_SITE_DIR: ${{ env.PAGES_SITE_DIR }}
          PAGES_REQUIRE_WASM: "1"
          PAGES_REQUIRE_DOCS: "1"
        run: scripts/ci-pages-assemble-site

      - name: Configure GitHub Pages
        if: ${{ !env.ACT }}
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages Artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ env.PAGES_SITE_DIR }}

      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
