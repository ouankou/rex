name: Publish Docs

on:
  schedule:
    # Every Thursday at 00:00 UTC
    - cron: "0 0 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-publish-main
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            antlr4 \
            bison \
            build-essential \
            clang-20 \
            cmake \
            curl \
            flex \
            libclang-20-dev \
            libantlr4-runtime-dev \
            llvm-20 \
            llvm-20-dev \
            perl

      - name: Install ANTLR4 tool (4.10.1)
        run: |
          set -euo pipefail
          mkdir -p .tools/antlr4
          curl -L https://www.antlr.org/download/antlr-4.10.1-complete.jar \
            -o .tools/antlr4/antlr-4.10.1-complete.jar
          cat > .tools/antlr4/antlr4 <<'SH'
          #!/usr/bin/env bash
          exec java -jar "$(dirname "$0")/antlr-4.10.1-complete.jar" "$@"
          SH
          chmod +x .tools/antlr4/antlr4

      - name: Install MrDocs (latest)
        run: |
          set -euo pipefail
          MRDOCS_URL="$(python - <<'PY'
          import json, urllib.request
          url = 'https://api.github.com/repos/cppalliance/mrdocs/releases/latest'
          release = json.loads(urllib.request.urlopen(url, timeout=10).read().decode('utf-8'))
          assets = {a['name']: a['browser_download_url'] for a in release.get('assets', [])}
          linux_xz = next((u for n, u in assets.items() if n.endswith('Linux.tar.xz')), '')
          linux_gz = next((u for n, u in assets.items() if n.endswith('Linux.tar.gz')), '')
          print(linux_xz or linux_gz or '')
          PY
          )"
          if [ -z "$MRDOCS_URL" ]; then
            echo "MrDocs Linux release asset not found" >&2
            exit 1
          fi
          curl -L "$MRDOCS_URL" -o mrdocs.tar.xz
          tar -xf mrdocs.tar.xz
          MRDOCS_DIR="$(tar -tf mrdocs.tar.xz | sed -n '1p' | cut -d/ -f1)"
          echo "$PWD/$MRDOCS_DIR/bin" >> "$GITHUB_PATH"
          echo "MRDOCS_BIN=$PWD/$MRDOCS_DIR/bin/mrdocs" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs dependencies (venv)
        run: |
          python -m venv .venv-docs
          . .venv-docs/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Configure build (compile_commands.json)
        env:
          PATH: /usr/lib/llvm-20/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          CMAKE_PREFIX_PATH: /usr/lib/llvm-20
          LLVM_DIR: /usr/lib/llvm-20
          CC: clang-20
          CXX: clang++-20
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DANTLR4_EXECUTABLE="$PWD/.tools/antlr4/antlr4" \
            -DENABLE-C=ON \
            -DENABLE-FORTRAN=OFF \
            -DENABLE-FORTRAN-OFP=OFF \
            -DENABLE-TESTS-DIRECTORY=OFF \
            -DENABLE-TUTORIAL-DIRECTORY=OFF
          cmake --build build -j"$(nproc)"

      - name: Build MrDocs API reference
        run: scripts/generate-api-documentation

      - name: Build MkDocs site
        run: .venv-docs/bin/mkdocs build

      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          force_orphan: true
          cname: rex.ouankou.com
