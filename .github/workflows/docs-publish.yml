name: Publish Docs

on:
  schedule:
    # Every Thursday at 00:00 UTC
    - cron: "0 0 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-publish-main
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            antlr4 \
            bison \
            build-essential \
            clang-20 \
            cmake \
            curl \
            flex \
            libclang-20-dev \
            libantlr4-runtime-dev \
            libhpdf-dev \
            llvm-20 \
            llvm-20-dev \
            perl \
            asciidoctor \
            pkg-config

      - name: Install ANTLR4 tool (4.10.1)
        run: |
          set -euo pipefail
          mkdir -p .tools/antlr4
          curl -L https://www.antlr.org/download/antlr-4.10.1-complete.jar \
            -o .tools/antlr4/antlr-4.10.1-complete.jar
          cat > .tools/antlr4/antlr4 <<'SH'
          #!/usr/bin/env bash
          exec java -jar "$(dirname "$0")/antlr-4.10.1-complete.jar" "$@"
          SH
          chmod +x .tools/antlr4/antlr4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs (shared script)
        env:
          PATH: /usr/lib/llvm-20/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          CMAKE_PREFIX_PATH: /usr/lib/llvm-20
          LLVM_DIR: /usr/lib/llvm-20
          CC: clang-20
          CXX: clang++-20
          DOCS_ANTLR4_EXECUTABLE: ${{ github.workspace }}/.tools/antlr4/antlr4
          DOCS_JOBS: 32
        run: bash scripts/ci-docs-build

      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          force_orphan: true
          cname: rex.ouankou.com
