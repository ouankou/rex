name: Publish Docs

on:
  schedule:
    # Every Thursday at 00:00 UTC
    - cron: "0 0 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  LLVM_VERSION: 22

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Add LLVM apt repository
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc > /dev/null
          echo "deb http://apt.llvm.org/resolute/ llvm-toolchain-resolute-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            antlr4 \
            bison \
            build-essential \
            clang-${LLVM_VERSION} \
            cmake \
            curl \
            flex \
            lld-${LLVM_VERSION} \
            libflang-${LLVM_VERSION}-dev \
            libclang-${LLVM_VERSION}-dev \
            libomp-${LLVM_VERSION}-dev \
            libantlr4-runtime-dev \
            libhpdf-dev \
            llvm-${LLVM_VERSION} \
            llvm-${LLVM_VERSION}-dev \
            mold \
            perl \
            asciidoctor \
            pkg-config

      - name: Install ANTLR4 tool (4.10.1)
        run: |
          set -euo pipefail
          mkdir -p .tools/antlr4
          curl -L https://www.antlr.org/download/antlr-4.10.1-complete.jar \
            -o .tools/antlr4/antlr-4.10.1-complete.jar
          cat > .tools/antlr4/antlr4 <<'SH'
          #!/usr/bin/env bash
          exec java -jar "$(dirname "$0")/antlr-4.10.1-complete.jar" "$@"
          SH
          chmod +x .tools/antlr4/antlr4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build docs (shared script)
        env:
          PATH: /usr/lib/llvm-${{ env.LLVM_VERSION }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          CMAKE_PREFIX_PATH: /usr/lib/llvm-${{ env.LLVM_VERSION }}
          LLVM_DIR: /usr/lib/llvm-${{ env.LLVM_VERSION }}
          CC: clang-${{ env.LLVM_VERSION }}
          CXX: clang++-${{ env.LLVM_VERSION }}
          DOCS_ANTLR4_EXECUTABLE: ${{ github.workspace }}/.tools/antlr4/antlr4
          DOCS_JOBS: 32
        run: bash scripts/ci-docs-build

      - name: Upload GitHub Pages Artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-26.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v5
