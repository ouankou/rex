name: Weekly MIPS64el CI

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-mips64el-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mips64el:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Set up QEMU (mips64le)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: mips64le

    - name: Build and test (mips64el via QEMU)
      env:
        LLVM_VERSION: 21
      run: |
        set -euo pipefail
        docker run --rm --platform=linux/mips64le \
          -v "${GITHUB_WORKSPACE}:/work" \
          -w /work \
          -e LLVM_VERSION="${LLVM_VERSION}" \
          ghcr.io/${{ github.repository_owner }}/rex:base \
          bash -lc '
            set -euo pipefail
            export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:${PATH}"
            export CMAKE_PREFIX_PATH="/usr/lib/llvm-${LLVM_VERSION}"
            export LLVM_DIR="/usr/lib/llvm-${LLVM_VERSION}"
            export CC="clang-${LLVM_VERSION}"
            export CXX="clang++-${LLVM_VERSION}"
            export LD_LIBRARY_PATH="/usr/lib/llvm-${LLVM_VERSION}/lib:${LD_LIBRARY_PATH:-}"

            git config --global --add safe.directory /work

            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_INSTALL_PREFIX=/work/rex_install \
              -DENABLE-C=ON \
              -DENABLE-FORTRAN=OFF \
              -DENABLE-FORTRAN-OFP=OFF \
              -DENABLE-FORTRAN-FLANG=OFF \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

            cmake --build build -j"$(nproc)"
            cmake --install build

            cd /work/build
            ctest -R astInterface
            ctest -R testQuery
            ctest -R rex
          '
