name: Nightly x86_64 CI

on:
  workflow_run:
    workflows:
    - Nightly REX Images
    types:
    - completed
  workflow_dispatch:

concurrency:
  group: nightly-amd64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-amd64:
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      packages: read

    defaults:
      run:
        shell: bash

    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
      LOCAL_IMAGE_REPO: rex-local
      TARGET_ARCH: amd64
      TARGET_PLATFORM: linux/amd64

    steps:
    - name: Require successful nightly image publication
      if: ${{ github.event_name == 'workflow_run' }}
      env:
        IMAGE_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      run: |
        set -euo pipefail
        if [[ "${IMAGE_WORKFLOW_CONCLUSION}" != "success" ]]; then
          echo "Nightly REX Images concluded '${IMAGE_WORKFLOW_CONCLUSION}'; no current dev image was published." >&2
          exit 1
        fi

    - name: Run retained fragile tests from prebuilt image (${{ env.TARGET_ARCH }})
      if: ${{ !env.ACT && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW_RUN_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        set -euo pipefail
        source_sha="${WORKFLOW_RUN_SOURCE_SHA}"
        if [[ -z "${source_sha}" ]]; then
          source_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly-rex-images.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha')"
        fi
        if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Nightly image run has no exact source revision: '${source_sha}'" >&2
          exit 1
        fi
        image_ref="${IMAGE_REPO}:dev-${source_sha}"
        docker pull --platform="${TARGET_PLATFORM}" "${image_ref}"
        image_revision="$(docker image inspect "${image_ref}" \
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
        if [[ "${image_revision}" != "${source_sha}" ]]; then
          echo "Nightly image revision '${image_revision}' does not match immutable tag '${source_sha}'" >&2
          exit 1
        fi
        echo "Testing ${image_ref} ($(docker image inspect "${image_ref}" --format '{{ index .RepoDigests 0 }}'))"
        docker run --rm --platform="${TARGET_PLATFORM}" \
          "${image_ref}" \
          bash -lc '
            set -euo pipefail
            cd /opt/rex/src
            python3 scripts/run_ctest_name_set.py \
              --test-dir build \
              --manifest tests/fragile/unparser_hardening_full.txt \
              --include-regex "rex|astInterface|OMPLOWERING_RODINIA_" \
              --jobs "$(nproc)"
          '

    - name: Run retained fragile tests from local dev image (${{ env.TARGET_ARCH }})
      if: ${{ env.ACT }}
      run: |
        set -euo pipefail
        docker run --rm --platform="${TARGET_PLATFORM}" \
          "${LOCAL_IMAGE_REPO}:dev-${TARGET_ARCH}-local" \
          bash -lc '
            set -euo pipefail
            cd /opt/rex/src
            python3 scripts/run_ctest_name_set.py \
              --test-dir build \
              --manifest tests/fragile/unparser_hardening_full.txt \
              --include-regex "rex|astInterface|OMPLOWERING_RODINIA_" \
              --jobs "$(nproc)"
          '
