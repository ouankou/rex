name: Nightly x86_64 CI

on:
  schedule:
    # Every day at 14:00 UTC (07:00 PDT)
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-amd64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-amd64:
    runs-on: ubuntu-26.04

    defaults:
      run:
        shell: bash

    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
      LOCAL_IMAGE_REPO: rex-local
      TARGET_ARCH: amd64
      TARGET_PLATFORM: linux/amd64

    steps:
    - name: Run core tests from prebuilt image (${{ env.TARGET_ARCH }})
      if: ${{ !env.ACT }}
      run: |
        set -euo pipefail
        docker pull --platform="${TARGET_PLATFORM}" "${IMAGE_REPO}:dev"
        docker run --rm --platform="${TARGET_PLATFORM}" \
          "${IMAGE_REPO}:dev" \
          bash -lc '
            set -euo pipefail
            cd /opt/rex/src
            CTEST_JOBS="$(nproc)"
            ctest --test-dir build \
              -R "rex|astInterface|OMPLOWERING_RODINIA_" \
              --output-on-failure \
              -j"${CTEST_JOBS}"
          '

    - name: Run core tests from local dev image (${{ env.TARGET_ARCH }})
      if: ${{ env.ACT }}
      run: |
        set -euo pipefail
        docker run --rm --platform="${TARGET_PLATFORM}" \
          "${LOCAL_IMAGE_REPO}:dev-${TARGET_ARCH}-local" \
          bash -lc '
            set -euo pipefail
            cd /opt/rex/src
            CTEST_JOBS="$(nproc)"
            ctest --test-dir build \
              -R "rex|astInterface|OMPLOWERING_RODINIA_" \
              --output-on-failure \
              -j"${CTEST_JOBS}"
          '
