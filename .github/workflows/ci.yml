name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        llvm: [21]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        persist-credentials: false

    # NOTE: Ubuntu 24.04 ships antlr4 v4.9 but antlr4-cpp-runtime v4.10, which are API-incompatible; manually install the matching antlr4 v4.10.
    - uses: StoneMoe/setup-antlr4@v4.10.1

    - name: Add LLVM apt repository
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc > /dev/null
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ matrix.llvm }} main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null

    # Install only version-specific LLVM/Clang packages from apt.llvm.org.
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bison \
          build-essential \
          cmake \
          clang-${{ matrix.llvm }} \
          curl \
          flang-${{ matrix.llvm }} \
          flex \
          g++ \
          gdb \
          ghostscript \
          git \
          graphviz \
          libantlr4-runtime-dev \
          libclang-${{ matrix.llvm }}-dev \
          libclang-cpp${{ matrix.llvm }}-dev \
          libhpdf-dev \
          libtool \
          llvm-${{ matrix.llvm }} \
          llvm-${{ matrix.llvm }}-dev \
          openjdk-25-jdk \
          pkg-config

    # Simplified build using build-rex.sh script
    - name: Build and Install (Debug)
      env:
        # Set up LLVM paths so "clang" resolves to the selected version.
        PATH: /usr/lib/llvm-${{ matrix.llvm }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        LD_LIBRARY_PATH: /usr/lib/llvm-${{ matrix.llvm }}/lib:/usr/lib/jvm/java-25-openjdk-amd64/lib/server
        CMAKE_PREFIX_PATH: /usr/lib/llvm-${{ matrix.llvm }}
        LLVM_DIR: /usr/lib/llvm-${{ matrix.llvm }}
        CC: clang-${{ matrix.llvm }}
        CXX: clang++-${{ matrix.llvm }}
        FC: flang-${{ matrix.llvm }}
      run: |
        cd $GITHUB_WORKSPACE
        ./build-rex.sh $GITHUB_WORKSPACE/rex_install Debug

    # Run frontend-related tests
    - name: Run core and OpenMP tests
      env:
        PATH: /usr/lib/llvm-${{ matrix.llvm }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        LD_LIBRARY_PATH: /usr/lib/llvm-${{ matrix.llvm }}/lib:/usr/lib/jvm/java-25-openjdk-amd64/lib/server
      run: |
        cd $GITHUB_WORKSPACE
        CTEST_JOBS="$(nproc)"
        ctest --test-dir build -R "rex|astInterface|testQuery|fortran|f90|f03|f77|caf|gfortran" --exclude-regex "omp_lowering" --output-on-failure -j"${CTEST_JOBS}"
        ctest --test-dir build/tests/nonsmoke/functional/CompileTests/OpenMP_tests --output-on-failure -j"${CTEST_JOBS}"

  fortran-only-config:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        llvm: [21]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        persist-credentials: false

    - uses: StoneMoe/setup-antlr4@v4.10.1

    - name: Add LLVM apt repository
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc > /dev/null
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ matrix.llvm }} main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bison \
          build-essential \
          cmake \
          clang-${{ matrix.llvm }} \
          curl \
          flang-${{ matrix.llvm }} \
          flex \
          g++ \
          gdb \
          ghostscript \
          git \
          graphviz \
          libantlr4-runtime-dev \
          libclang-${{ matrix.llvm }}-dev \
          libclang-cpp${{ matrix.llvm }}-dev \
          libhpdf-dev \
          libtool \
          llvm-${{ matrix.llvm }} \
          llvm-${{ matrix.llvm }}-dev \
          openjdk-25-jdk \
          pkg-config

    - name: Configure and build (Fortran-only)
      env:
        PATH: /usr/lib/llvm-${{ matrix.llvm }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        LD_LIBRARY_PATH: /usr/lib/llvm-${{ matrix.llvm }}/lib
        CMAKE_PREFIX_PATH: /usr/lib/llvm-${{ matrix.llvm }}
        LLVM_DIR: /usr/lib/llvm-${{ matrix.llvm }}
        CC: clang-${{ matrix.llvm }}
        CXX: clang++-${{ matrix.llvm }}
        FC: flang-${{ matrix.llvm }}
      run: |
        cmake -S . -B build-fortran-only \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE-C=OFF \
          -DENABLE-FORTRAN=ON \
          -DENABLE-FORTRAN-FLANG=ON
        cmake --build build-fortran-only -j"$(nproc)"

    - name: Verify Fortran-only compiler metadata
      run: |
        grep -E "^#define BACKEND_FORTRAN_COMPILER_MAJOR_VERSION_NUMBER [0-9]+$" build-fortran-only/rose_config.h
        grep -E "^#define BACKEND_FORTRAN_COMPILER_MINOR_VERSION_NUMBER [0-9]+$" build-fortran-only/rose_config.h
