name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "23"
  REX_WASM_ARTIFACT: rex-wasm-dist
  DOCS_SITE_ARTIFACT: docs-site
  PAGES_SITE_DIR: pages-site

jobs:
  build:
    name: Build and test ${{ matrix.suite }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        suite: [core, fragile]

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    - uses: StoneMoe/setup-antlr4@v4.13.2
      with:
        download_url: https://www.antlr.org/download/antlr-4.10.1-complete.jar

    - name: Install dependencies
      run: scripts/ci-install-deps native "${{ env.LLVM_VERSION }}"

    - name: Build and install
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        export CC="clang-${{ env.LLVM_VERSION }}"
        export CXX="clang++-${{ env.LLVM_VERSION }}"
        export FC="flang-${{ env.LLVM_VERSION }}"
        ./build-rex.sh "$GITHUB_WORKSPACE/rex_install" Debug

    - name: Validate Markdown documentation
      if: matrix.suite == 'core'
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        export DOCS_JOBS=2
        export MRDOCS_CONCURRENCY=2
        bash scripts/ci-docs-build

    - name: Run CI tests
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        core_tests='rex|astInterface|testQuery|fortran|f90|f03|gfortran|OMPTEST_|OMPACCTEST_|OMPFORTRAN_|OMPANALYZE_|OMPVV_5_0_|OMPVV_4_5_|OMPVV_5_1_|OMPVV_5_2_|OMPVV_6_0_|omp_lowering_|OMPLOWERING_CPU_|OMPLOWERING_RODINIA_|^Cxx_tests_test2013_69_C$|^Cxx_tests_test2013_198_C$'
        if [[ "${{ matrix.suite }}" == core ]]; then
          selector=(--include-regex "$core_tests")
        else
          selector=(--manifest tests/fragile/unparser_hardening_fast.txt
            --include-regex '^C_tests_test2015_14[12]_c$')
        fi
        python3 scripts/run_ctest_name_set.py \
          --test-dir build \
          "${selector[@]}"

    - name: Upload docs site
      if: matrix.suite == 'core'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.DOCS_SITE_ARTIFACT }}
        path: _site
        overwrite: true

  rex-wasm:
    name: Build & Test (WASM)
    uses: ./.github/workflows/rex-wasm-build.yml
    with:
      upload-artifact: true

  assemble-pages:
    name: Assemble Pages
    runs-on: ubuntu-26.04
    needs: [build, rex-wasm]
    outputs:
      artifact-name: github-pages-${{ github.run_attempt }}

    steps:
    - name: Checkout REX
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download REX WASM dist
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.REX_WASM_ARTIFACT }}
        path: ${{ env.REX_WASM_ARTIFACT }}

    - name: Download docs site
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.DOCS_SITE_ARTIFACT }}
        path: ${{ env.DOCS_SITE_ARTIFACT }}

    - name: Assemble GitHub Pages site
      env:
        PAGES_WASM_DIR: ${{ env.REX_WASM_ARTIFACT }}
        PAGES_DOCS_DIR: ${{ env.DOCS_SITE_ARTIFACT }}
        PAGES_SITE_DIR: ${{ env.PAGES_SITE_DIR }}
        PAGES_REQUIRE_DOCS: "1"
      run: scripts/ci-pages-assemble-site

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        name: github-pages-${{ github.run_attempt }}
        path: ${{ env.PAGES_SITE_DIR }}
        include-hidden-files: true

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-26.04
    needs: assemble-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Configure GitHub Pages
      uses: actions/configure-pages@v6

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
      with:
        artifact_name: ${{ needs.assemble-pages.outputs.artifact-name }}
