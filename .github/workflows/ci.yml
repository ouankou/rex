name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  REX_WASM_ARTIFACT: rex-wasm-dist
  DOCS_SITE_ARTIFACT: docs-site
  PAGES_SITE_DIR: pages-site

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-26.04]
        llvm: [22]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    # NOTE: Ubuntu 26.04 ships antlr4-cpp-runtime v4.10; use a matching ANTLR4 CLI while keeping the action runtime current.
    - uses: StoneMoe/setup-antlr4@v4.13.2
      with:
        download_url: https://www.antlr.org/download/antlr-4.10.1-complete.jar

    # Install only version-specific LLVM/Clang packages from apt.llvm.org.
    - name: Install dependencies
      run: scripts/ci-install-deps native "${{ matrix.llvm }}"

    # Simplified build using build-rex.sh script
    - name: Build and Install (Debug)
      run: |
        cd $GITHUB_WORKSPACE
        source scripts/ci-llvm-env "${{ matrix.llvm }}"
        export CC=clang-${{ matrix.llvm }}
        export CXX=clang++-${{ matrix.llvm }}
        export FC=flang-${{ matrix.llvm }}
        ./build-rex.sh $GITHUB_WORKSPACE/rex_install Debug

    # Run frontend-related tests
    - name: Run core and OpenMP tests
      run: |
        cd $GITHUB_WORKSPACE
        source scripts/ci-llvm-env "${{ matrix.llvm }}"
        CTEST_JOBS="$(nproc)"

        # Single CI sweep: core + OpenMP AST + OpenMP lowering suites.
        ctest --test-dir build -R "rex|astInterface|testQuery|fortran|f90|f03|gfortran|OMPTEST_|OMPACCTEST_|OMPFORTRAN_|OMPANALYZE_|OMPVV_5_0_|OMPVV_4_5_|OMPVV_5_1_|OMPVV_5_2_|OMPVV_6_0_|omp_lowering_|OMPLOWERING_CPU_|OMPLOWERING_RODINIA_|^Cxx_tests_test2013_69_C$|^Cxx_tests_test2013_198_C$" --output-on-failure -j"${CTEST_JOBS}"

  rex-wasm:
    name: Build & Test (WASM)
    uses: ./.github/workflows/rex-wasm-build.yml
    with:
      upload-artifact: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  deploy-rex-wasm:
    name: Deploy REX WASM site
    runs-on: ubuntu-26.04
    needs: [build, rex-wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout REX
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download REX WASM dist
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.REX_WASM_ARTIFACT }}
        path: ${{ env.REX_WASM_ARTIFACT }}

    - name: Download latest docs site artifact
      id: docs-artifact
      env:
        GH_TOKEN: ${{ github.token }}
        DOCS_ARTIFACT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        scripts/ci-download-latest-artifact "$DOCS_SITE_ARTIFACT" "$DOCS_SITE_ARTIFACT" --optional "$DOCS_ARTIFACT_BRANCH"

    - name: Skip deploy until docs artifact exists
      if: steps.docs-artifact.outputs.found != 'true'
      run: |
        echo "No $DOCS_SITE_ARTIFACT artifact found; run Publish Docs once to bootstrap the full static site."

    - name: Assemble GitHub Pages site
      if: steps.docs-artifact.outputs.found == 'true'
      env:
        PAGES_WASM_DIR: ${{ env.REX_WASM_ARTIFACT }}
        PAGES_DOCS_DIR: ${{ env.DOCS_SITE_ARTIFACT }}
        PAGES_SITE_DIR: ${{ env.PAGES_SITE_DIR }}
        PAGES_REQUIRE_DOCS: "1"
      run: scripts/ci-pages-assemble-site

    - name: Configure GitHub Pages
      if: steps.docs-artifact.outputs.found == 'true'
      uses: actions/configure-pages@v6

    - name: Upload GitHub Pages artifact
      if: steps.docs-artifact.outputs.found == 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ env.PAGES_SITE_DIR }}

    - name: Deploy to GitHub Pages
      if: steps.docs-artifact.outputs.found == 'true'
      id: deployment
      uses: actions/deploy-pages@v5
