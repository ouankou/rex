name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "22"
  REX_WASM_ARTIFACT: rex-wasm-dist
  DOCS_SITE_ARTIFACT: docs-site
  PAGES_SITE_DIR: pages-site

jobs:
  build:
    name: Build and test native
    runs-on: ubuntu-26.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    - uses: StoneMoe/setup-antlr4@v4.13.2
      with:
        download_url: https://www.antlr.org/download/antlr-4.10.1-complete.jar

    - name: Install dependencies
      run: scripts/ci-install-deps native "${{ env.LLVM_VERSION }}"

    - name: Build and install
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        export CC="clang-${{ env.LLVM_VERSION }}"
        export CXX="clang++-${{ env.LLVM_VERSION }}"
        export FC="flang-${{ env.LLVM_VERSION }}"
        ./build-rex.sh "$GITHUB_WORKSPACE/rex_install" Debug

    - name: Run CI tests
      run: |
        source scripts/ci-llvm-env "${{ env.LLVM_VERSION }}"
        core_tests='rex|astInterface|testQuery|fortran|f90|f03|gfortran|OMPTEST_|OMPACCTEST_|OMPFORTRAN_|OMPANALYZE_|OMPVV_5_0_|OMPVV_4_5_|OMPVV_5_1_|OMPVV_5_2_|OMPVV_6_0_|omp_lowering_|OMPLOWERING_CPU_|OMPLOWERING_RODINIA_|^Cxx_tests_test2013_69_C$|^Cxx_tests_test2013_198_C$'
        python3 scripts/run_ctest_name_set.py \
          --test-dir build \
          --manifest tests/fragile/unparser_hardening_fast.txt \
          --include-regex "$core_tests" \
          --jobs "$(nproc)"

  rex-wasm:
    name: Build & Test (WASM)
    uses: ./.github/workflows/rex-wasm-build.yml
    with:
      upload-artifact: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  deploy-rex-wasm:
    name: Deploy REX WASM site
    runs-on: ubuntu-26.04
    needs: [build, rex-wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout REX
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download REX WASM dist
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.REX_WASM_ARTIFACT }}
        path: ${{ env.REX_WASM_ARTIFACT }}

    - name: Download latest docs site artifact
      id: docs-artifact
      env:
        GH_TOKEN: ${{ github.token }}
        DOCS_ARTIFACT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        scripts/ci-download-latest-artifact "$DOCS_SITE_ARTIFACT" "$DOCS_SITE_ARTIFACT" --optional "$DOCS_ARTIFACT_BRANCH"

    - name: Skip deploy until docs artifact exists
      if: steps.docs-artifact.outputs.found != 'true'
      run: |
        echo "No $DOCS_SITE_ARTIFACT artifact found; run Publish Docs once to bootstrap the full static site."

    - name: Assemble GitHub Pages site
      if: steps.docs-artifact.outputs.found == 'true'
      env:
        PAGES_WASM_DIR: ${{ env.REX_WASM_ARTIFACT }}
        PAGES_DOCS_DIR: ${{ env.DOCS_SITE_ARTIFACT }}
        PAGES_SITE_DIR: ${{ env.PAGES_SITE_DIR }}
        PAGES_REQUIRE_DOCS: "1"
      run: scripts/ci-pages-assemble-site

    - name: Configure GitHub Pages
      if: ${{ steps.docs-artifact.outputs.found == 'true' && !env.ACT }}
      uses: actions/configure-pages@v6

    - name: Upload GitHub Pages artifact
      if: ${{ steps.docs-artifact.outputs.found == 'true' && !env.ACT }}
      uses: actions/upload-pages-artifact@v5
      with:
        name: github-pages-${{ github.run_attempt }}
        path: ${{ env.PAGES_SITE_DIR }}
        include-hidden-files: true

    - name: Deploy to GitHub Pages
      if: ${{ steps.docs-artifact.outputs.found == 'true' && !env.ACT }}
      id: deployment
      uses: actions/deploy-pages@v5
      with:
        artifact_name: github-pages-${{ github.run_attempt }}
