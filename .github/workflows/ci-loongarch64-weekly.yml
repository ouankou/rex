name: Weekly LoongArch64 CI

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-loongarch64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-loong64:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Set up QEMU (loong64)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: loong64

    - name: Build and test (loong64 via QEMU)
      env:
        # Base image ships LLVM 21 for loong64 on Debian sid.
        LLVM_VERSION: 21
      run: |
        set -euo pipefail
        docker run --rm --platform=linux/loong64 \
          -v "${GITHUB_WORKSPACE}:/work" \
          -w /work \
          -e LLVM_VERSION="${LLVM_VERSION}" \
          ghcr.io/${{ github.repository_owner }}/rex:base \
          bash -lc '
            set -euo pipefail
            export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:${PATH}"
            export CMAKE_PREFIX_PATH="/usr/lib/llvm-${LLVM_VERSION}"
            export LLVM_DIR="/usr/lib/llvm-${LLVM_VERSION}"
            export CC="clang-${LLVM_VERSION}"
            export CXX="clang++-${LLVM_VERSION}"
            export FC="flang-${LLVM_VERSION}"

            JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
            export LD_LIBRARY_PATH="/usr/lib/llvm-${LLVM_VERSION}/lib:${JAVA_HOME}/lib/server:${LD_LIBRARY_PATH:-}"

            git config --global --add safe.directory /work

            JOBS="$(nproc 2>/dev/null || echo 4)"
            if [ "${JOBS}" -gt 32 ]; then
              JOBS=32
            fi
            export NUM_JOBS="${JOBS}"

            ./build-rex.sh /work/rex_install Debug

            # RTH tests default to a 15-minute timeout; scale for QEMU user-mode emulation.
            export ROSE_TEST_TIMEOUT_SCALE=3
            # CTest also has a global 1500s timeout; keep it in sync with the RTH timeout scaling.
            CTEST_TIMEOUT="$((1500 * ROSE_TEST_TIMEOUT_SCALE))"
            ctest --test-dir /work/build \
              -R "rex|astInterface|testQuery|fortran|f90|f03|f77|caf|gfortran" \
              --exclude-regex "omp_lowering|gdf_f77_constprop_test2007_189_f|gdf_f77_constprop_test2007_227_f" \
              --output-on-failure \
              --timeout "${CTEST_TIMEOUT}" \
              -j"${JOBS}"
          '
