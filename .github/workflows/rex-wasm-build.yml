name: Build REX WASM

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: Upload the generated static WASM site as an artifact.
        type: boolean
        default: false
      llvm-project-ref:
        type: string
        default: llvmorg-22.1.8
      emsdk-version:
        type: string
        default: 4.0.22
      build-type:
        type: string
        default: MinSizeRel
      package-sysroot:
        description: Package Emscripten sysroot headers into the browser demo.
        type: boolean
        default: false
      llvm-project-checkout-dir:
        type: string
        default: llvm-project
      llvm-wasm-cache-dir:
        type: string
        default: .build/rex-wasm/llvm-wasm
      rex-wasm-cmake-build-dir:
        type: string
        default: .build/rex-wasm/rex
      artifact-name:
        type: string
        default: rex-wasm-dist
      artifact-retention-days:
        type: number
        default: 90

permissions:
  contents: read

jobs:
  build:
    name: Build & Test WASM
    runs-on: ubuntu-26.04

    defaults:
      run:
        shell: bash

    env:
      LLVM_VERSION: "22"
      LLVM_PROJECT_REF: ${{ inputs.llvm-project-ref }}
      EMSDK_VERSION: ${{ inputs.emsdk-version }}
      REX_WASM_BUILD_TYPE: ${{ inputs.build-type }}
      REX_WASM_PACKAGE_SYSROOT: ${{ inputs.package-sysroot }}
      LLVM_PROJECT_CHECKOUT_DIR: ${{ inputs.llvm-project-checkout-dir }}
      LLVM_WASM_CACHE_DIR: ${{ inputs.llvm-wasm-cache-dir }}
      REX_WASM_CMAKE_BUILD_DIR: ${{ inputs.rex-wasm-cmake-build-dir }}
      EMSDK_ACTION_CACHE_DIR: .build/rex-wasm/emsdk
      REX_WASM_ARTIFACT: ${{ inputs.artifact-name }}
      LLVM_SOURCE_DIR: ${{ github.workspace }}/${{ inputs.llvm-project-checkout-dir }}/llvm
      LLVM_WASM_BUILD_DIR: ${{ github.workspace }}/${{ inputs.llvm-wasm-cache-dir }}
      REX_WASM_BUILD_DIR: ${{ github.workspace }}/${{ inputs.rex-wasm-cmake-build-dir }}
      REX_WASM_EMSDK_ROOT: ${{ github.workspace }}/.build/rex-wasm/emsdk/emsdk-main
      REX_WASM_DIST_DIR: ${{ github.workspace }}/build/rex-wasm/dist
      REX_WASM_TEST_TIMEOUT: 180s

    steps:
      - name: Checkout REX
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout LLVM project
        uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          ref: ${{ env.LLVM_PROJECT_REF }}
          path: ${{ env.LLVM_PROJECT_CHECKOUT_DIR }}
          persist-credentials: false

      - name: Resolve exact LLVM source commit
        id: llvm-source
        run: |
          commit="$(git -C "${LLVM_PROJECT_CHECKOUT_DIR}" rev-parse --verify 'HEAD^{commit}')"
          if [[ ! "${commit}" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "error: malformed LLVM source commit '${commit}'" >&2
            exit 2
          fi
          if [[ -n "$(git -C "${LLVM_PROJECT_CHECKOUT_DIR}" status --porcelain --untracked-files=no)" ]]; then
            echo "error: LLVM source checkout has tracked modifications" >&2
            exit 2
          fi
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "LLVM_PROJECT_COMMIT=${commit}" >> "${GITHUB_ENV}"

      - name: Restore wasm LLVM cache
        id: restore-llvm-wasm
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.LLVM_WASM_CACHE_DIR }}
          key: rex-wasm-llvm-${{ runner.os }}-${{ runner.arch }}-emsdk-${{ env.EMSDK_VERSION }}-${{ steps.llvm-source.outputs.commit }}-${{ inputs.llvm-project-checkout-dir }}-${{ env.REX_WASM_BUILD_TYPE }}-${{ hashFiles('.github/workflows/rex-wasm-build.yml', 'scripts/ci-rex-wasm-build-dist', 'cmake/rex_wasm_llvm_probe/**') }}

      - name: Report wasm LLVM cache hit
        run: |
          cache_hit="${{ steps.restore-llvm-wasm.outputs.cache-hit }}"
          matched_key="${{ steps.restore-llvm-wasm.outputs.cache-matched-key }}"
          if [[ "${cache_hit}" == "true" ]]; then
            echo "wasm LLVM cache: exact hit"
          else
            echo "wasm LLVM cache: miss; LLVM will be built from source"
          fi
          {
            echo "### REX WASM cache"
            echo "- actions/cache cache-hit: ${cache_hit:-false}"
            echo "- requested ref: ${LLVM_PROJECT_REF}"
            echo "- exact commit: ${{ steps.llvm-source.outputs.commit }}"
            echo "- cache key: rex-wasm-llvm-${{ runner.os }}-${{ runner.arch }}-emsdk-${EMSDK_VERSION}-${{ steps.llvm-source.outputs.commit }}-${LLVM_PROJECT_CHECKOUT_DIR}-${REX_WASM_BUILD_TYPE}-${{ hashFiles('.github/workflows/rex-wasm-build.yml', 'scripts/ci-rex-wasm-build-dist', 'cmake/rex_wasm_llvm_probe/**') }}"
            echo "- matched key: ${matched_key:-none}"
            echo "- cache path: ${LLVM_WASM_CACHE_DIR}"
            echo "- cache save enabled: $([[ '${{ github.event_name }}' != 'pull_request' ]] && echo yes || echo no)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install system dependencies
        run: scripts/ci-install-deps wasm "${{ env.LLVM_VERSION }}"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: ${{ env.EMSDK_ACTION_CACHE_DIR }}
          cache-key: rex-emsdk-${{ runner.os }}-${{ runner.arch }}-${{ env.EMSDK_VERSION }}

      - name: Inspect wasm LLVM cache contents
        run: |
          source scripts/ci-llvm-env "${LLVM_VERSION}"
          scripts/ci-rex-wasm-build-dist llvm-status

      - name: Validate exact restored wasm LLVM/Clang cache
        if: ${{ steps.restore-llvm-wasm.outputs.cache-hit == 'true' }}
        run: |
          source scripts/ci-llvm-env "${LLVM_VERSION}"
          scripts/ci-rex-wasm-build-dist verify-llvm-cache

      - name: Build wasm LLVM/Clang after an exact cache miss
        if: ${{ steps.restore-llvm-wasm.outputs.cache-hit != 'true' }}
        run: |
          source scripts/ci-llvm-env "${LLVM_VERSION}"
          scripts/ci-rex-wasm-build-dist llvm

      - name: Configure REX WASM
        run: |
          source scripts/ci-llvm-env "${LLVM_VERSION}"
          scripts/ci-rex-wasm-build-dist configure-rex

      - name: Build REX WASM target
        run: |
          source scripts/ci-llvm-env "${LLVM_VERSION}"
          scripts/ci-rex-wasm-build-dist build-rex

      - name: Run REX WASM smoke tests
        run: |
          source scripts/ci-llvm-env "${LLVM_VERSION}"
          scripts/ci-rex-wasm-build-dist test

      - name: Assemble static REX WASM site
        run: |
          source scripts/ci-llvm-env "${LLVM_VERSION}"
          scripts/ci-rex-wasm-build-dist dist

      - name: Save wasm LLVM cache
        if: ${{ steps.restore-llvm-wasm.outputs.cache-hit != 'true' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.LLVM_WASM_CACHE_DIR }}
          key: ${{ steps.restore-llvm-wasm.outputs.cache-primary-key }}

      - name: Upload REX WASM dist
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.REX_WASM_ARTIFACT }}
          path: ${{ env.REX_WASM_DIST_DIR }}
          retention-days: ${{ inputs.artifact-retention-days }}
          overwrite: true
