name: Nightly CI

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
  LOCAL_IMAGE_REPO: rex-local

jobs:
  test:
    name: Test ${{ matrix.arch }} image
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, riscv64, loong64]

    steps:
      - name: Set up QEMU
        if: ${{ matrix.arch != 'amd64' && (matrix.arch != 'arm64' || env.ACT) }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.arch }}

      - name: Run tests
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ env.ACT && format('{0}:dev-{1}-local', env.LOCAL_IMAGE_REPO, matrix.arch) || format('{0}:dev', env.IMAGE_REPO) }}
        run: |
          main_tests='rex|astInterface|testQuery|fortran|f90|f03|gfortran|OMPTEST_|OMPACCTEST_|OMPFORTRAN_|OMPANALYZE_|OMPVV_5_0_|OMPVV_4_5_|OMPVV_5_1_|OMPVV_5_2_|OMPVV_6_0_|omp_lowering_|OMPLOWERING_CPU_|OMPLOWERING_RODINIA_|^Cxx_tests_test2013_69_C$|^Cxx_tests_test2013_198_C$'
          run_tests() {
            docker run --rm --platform="linux/$ARCH" "$IMAGE" \
              python3 /opt/rex/src/scripts/run_ctest_name_set.py \
              --test-dir /opt/rex/src/build --jobs "${ACT_CTEST_JOBS:-4}" "$@"
          }
          if [[ "$ARCH" == amd64 || ( "$ARCH" == arm64 && -z "${ACT:-}" ) ]]; then
            run_tests \
              --manifest /opt/rex/src/tests/fragile/unparser_hardening_full.txt \
              --include-regex "$main_tests|OpenACC|openacc|^tokenStreamMapping_test2012_173_c$|^(C|copyAST|MERGEASTTEST|SOURCEPOSITIONTEST|test(Static|Virtual|Interprocedural)CFG|ASTJSON|NAMEQUALIFICATIONTEST|HIDDENTYPETEST|rosetta|unparse|FORTRANTEST|GFORTRANSUITE)"
          else
            run_tests \
              --manifest /opt/rex/src/tests/fragile/rex_nightly_cross_architecture.txt \
              --include-regex '^rex_|astInterface|OMPTEST_'
          fi
