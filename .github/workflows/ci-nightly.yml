name: Nightly CI

on:
  workflow_run:
    workflows:
      - Nightly REX Images
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable nightly image source SHA
        required: true
        type: string

concurrency:
  group: nightly-ci-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
  LOCAL_IMAGE_REPO: rex-local
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}

jobs:
  test:
    name: Test ${{ matrix.arch }} image
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
          - riscv64
          - loong64

    steps:
      - name: Set up QEMU
        if: ${{ matrix.arch == 'riscv64' || matrix.arch == 'loong64' }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.arch }}

      - name: Run tests
        env:
          IMAGE: ${{ env.ACT && format('{0}:dev-{1}-local', env.LOCAL_IMAGE_REPO, matrix.arch) || format('{0}:dev-{1}', env.IMAGE_REPO, env.SOURCE_SHA) }}
          MANIFEST: ${{ matrix.arch == 'amd64' && 'unparser_hardening_full.txt' || 'rex_nightly_cross_architecture.txt' }}
          INCLUDE_REGEX: ${{ matrix.arch == 'amd64' && 'rex|astInterface|OMPLOWERING_RODINIA_' || '' }}
        run: |
          docker run --rm --platform=linux/${{ matrix.arch }} \
            "$IMAGE" python3 /opt/rex/src/scripts/run_ctest_name_set.py \
              --test-dir /opt/rex/src/build \
              --manifest "/opt/rex/src/tests/fragile/$MANIFEST" \
              --include-regex "$INCLUDE_REGEX" \
              --jobs 4
