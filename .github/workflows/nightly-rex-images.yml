name: Nightly REX Images

on:
  schedule:
    # Every day at 08:00 UTC (01:00 PDT)
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-rex-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: bash

    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
      REX_TAG: latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Set up QEMU (riscv64, loong64)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: riscv64,loong64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push REX image (riscv64)
      id: build-riscv64
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: linux/riscv64
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build and push REX image (loong64)
      id: build-loong64
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: linux/loong64
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Publish multi-arch manifest (default latest tag)
      run: |
        set -euo pipefail
        docker buildx imagetools create \
          -t "${IMAGE_REPO}:${REX_TAG}" \
          "${IMAGE_REPO}@${{ steps.build-riscv64.outputs.digest }}" \
          "${IMAGE_REPO}@${{ steps.build-loong64.outputs.digest }}"
        docker buildx imagetools inspect "${IMAGE_REPO}:${REX_TAG}"
