name: Nightly REX Images

on:
  schedule:
    # Every day at 08:00 UTC (01:00 PDT)
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-rex-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
  LOCAL_IMAGE_REPO: rex-local
  REX_IMAGE_BUILD_JOBS: 4

jobs:
  build:
    name: Build ${{ matrix.arch }} images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          platform: linux/amd64
          valgrind: 1
          uninitialized_fields: "ON"
        - arch: arm64
          platform: linux/arm64
          valgrind: 0
          uninitialized_fields: "OFF"
        - arch: riscv64
          platform: linux/riscv64
          valgrind: 0
          uninitialized_fields: "OFF"
        - arch: loong64
          platform: linux/loong64
          valgrind: 0
          uninitialized_fields: "OFF"

    env:
      TARGET_ARCH: ${{ matrix.arch }}
      TARGET_PLATFORM: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up QEMU
      if: ${{ matrix.arch != 'amd64' }}
      uses: docker/setup-qemu-action@v4
      with:
        platforms: ${{ matrix.arch }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      if: ${{ !env.ACT }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push runtime image
      if: ${{ !env.ACT }}
      id: runtime
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: ${{ matrix.platform }}
        target: runtime
        pull: true
        provenance: false
        labels: org.opencontainers.image.revision=${{ github.sha }}
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}
          REX_ENABLE_UNINITIALIZED_FIELD_TESTS=OFF
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build runtime image locally
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v7
      with:
        builder: default
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: ${{ matrix.platform }}
        target: runtime
        pull: false
        provenance: false
        labels: org.opencontainers.image.revision=${{ github.sha }}
        build-args: |
          BASE_IMAGE=${{ env.LOCAL_IMAGE_REPO }}:base-${{ matrix.arch }}-local
          REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}
          REX_ENABLE_UNINITIALIZED_FIELD_TESTS=OFF
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:runtime-${{ matrix.arch }}-local

    - name: Build and push development image
      if: ${{ !env.ACT }}
      id: dev
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: ${{ matrix.platform }}
        target: test
        pull: true
        provenance: false
        labels: org.opencontainers.image.revision=${{ github.sha }}
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}
          REX_ENABLE_VALGRIND=${{ matrix.valgrind }}
          REX_ENABLE_UNINITIALIZED_FIELD_TESTS=${{ matrix.uninitialized_fields }}
          REX_ENABLE_X86_SIMD_TESTS=ON
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build development image locally
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v7
      with:
        builder: default
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: ${{ matrix.platform }}
        target: test
        pull: false
        provenance: false
        labels: org.opencontainers.image.revision=${{ github.sha }}
        build-args: |
          BASE_IMAGE=${{ env.LOCAL_IMAGE_REPO }}:base-${{ matrix.arch }}-local
          REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}
          REX_ENABLE_VALGRIND=${{ matrix.valgrind }}
          REX_ENABLE_UNINITIALIZED_FIELD_TESTS=${{ matrix.uninitialized_fields }}
          REX_ENABLE_X86_SIMD_TESTS=ON
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:dev-${{ matrix.arch }}-local

    - name: Save image digests
      if: ${{ !env.ACT }}
      env:
        RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        DEV_DIGEST: ${{ steps.dev.outputs.digest }}
      run: |
        set -euo pipefail
        mkdir -p /tmp/rex-digests/runtime /tmp/rex-digests/dev
        touch "/tmp/rex-digests/runtime/${RUNTIME_DIGEST#sha256:}"
        touch "/tmp/rex-digests/dev/${DEV_DIGEST#sha256:}"

    - name: Upload image digests
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: image-digests-${{ matrix.arch }}
        path: /tmp/rex-digests
        if-no-files-found: error
        retention-days: 1

  publish:
    name: Publish multi-architecture manifests
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
      if: ${{ !env.ACT }}
      with:
        persist-credentials: false

    - name: Download image digests
      if: ${{ !env.ACT }}
      uses: actions/download-artifact@v8
      with:
        pattern: image-digests-*
        path: /tmp/rex-digests
        merge-multiple: true

    - name: Set up Docker Buildx
      if: ${{ !env.ACT }}
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      if: ${{ !env.ACT }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish manifests
      if: ${{ !env.ACT }}
      run: scripts/ci-publish-nightly-images "${IMAGE_REPO}" "${GITHUB_SHA}" /tmp/rex-digests
