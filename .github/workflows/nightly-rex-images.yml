name: Nightly REX Images

on:
  schedule:
    # Every day at 08:00 UTC (01:00 PDT)
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-rex-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-riscv64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      runtime_digest: ${{ steps.build-runtime.outputs.digest }}
      dev_digest: ${{ steps.build-dev.outputs.digest }}

    defaults:
      run:
        shell: bash

    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
      LOCAL_IMAGE_REPO: rex-local
      REX_RUNTIME_TAG: latest
      REX_DEV_TAG: dev

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Set up QEMU (riscv64)
      uses: docker/setup-qemu-action@v4
      with:
        platforms: riscv64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: ${{ !env.ACT }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push REX runtime image (riscv64)
      if: ${{ !env.ACT }}
      id: build-runtime
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: linux/riscv64
        target: runtime
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_LINKER=lld
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build REX runtime image locally (riscv64)
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: linux/riscv64
        target: runtime
        pull: true
        provenance: false
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:runtime-riscv64-local
        build-args: |
          BASE_IMAGE=${{ env.LOCAL_IMAGE_REPO }}:base-riscv64-local
          REX_LINKER=lld

    - name: Build and push REX dev image (riscv64)
      if: ${{ !env.ACT }}
      id: build-dev
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: linux/riscv64
        target: test
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_LINKER=lld
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build REX dev image locally (riscv64)
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: linux/riscv64
        target: test
        pull: true
        provenance: false
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:dev-riscv64-local
        build-args: |
          BASE_IMAGE=${{ env.LOCAL_IMAGE_REPO }}:base-riscv64-local
          REX_LINKER=lld

  build-loong64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      runtime_digest: ${{ steps.build-runtime.outputs.digest }}
      dev_digest: ${{ steps.build-dev.outputs.digest }}

    defaults:
      run:
        shell: bash

    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
      LOCAL_IMAGE_REPO: rex-local
      REX_RUNTIME_TAG: latest
      REX_DEV_TAG: dev

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Set up QEMU (loong64)
      uses: docker/setup-qemu-action@v4
      with:
        platforms: loong64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: ${{ !env.ACT }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push REX runtime image (loong64)
      if: ${{ !env.ACT }}
      id: build-runtime
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: linux/loong64
        target: runtime
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_LINKER=lld
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build REX runtime image locally (loong64)
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: linux/loong64
        target: runtime
        pull: true
        provenance: false
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:runtime-loong64-local
        build-args: |
          BASE_IMAGE=${{ env.LOCAL_IMAGE_REPO }}:base-loong64-local
          REX_LINKER=lld

    - name: Build and push REX dev image (loong64)
      if: ${{ !env.ACT }}
      id: build-dev
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: linux/loong64
        target: test
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_LINKER=lld
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build REX dev image locally (loong64)
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: linux/loong64
        target: test
        pull: true
        provenance: false
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:dev-loong64-local
        build-args: |
          BASE_IMAGE=${{ env.LOCAL_IMAGE_REPO }}:base-loong64-local
          REX_LINKER=lld

  publish-manifests:
    runs-on: ubuntu-24.04
    needs:
    - build-riscv64
    - build-loong64
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: bash

    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
      REX_RUNTIME_TAG: latest
      REX_DEV_TAG: dev

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: ${{ !env.ACT }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish multi-arch runtime manifest (latest tag)
      if: ${{ !env.ACT }}
      run: |
        set -euo pipefail
        docker buildx imagetools create \
          -t "${IMAGE_REPO}:${REX_RUNTIME_TAG}" \
          "${IMAGE_REPO}@${{ needs.build-riscv64.outputs.runtime_digest }}" \
          "${IMAGE_REPO}@${{ needs.build-loong64.outputs.runtime_digest }}"
        docker buildx imagetools inspect "${IMAGE_REPO}:${REX_RUNTIME_TAG}"

    - name: Publish multi-arch dev manifest (dev tag)
      if: ${{ !env.ACT }}
      run: |
        set -euo pipefail
        docker buildx imagetools create \
          -t "${IMAGE_REPO}:${REX_DEV_TAG}" \
          "${IMAGE_REPO}@${{ needs.build-riscv64.outputs.dev_digest }}" \
          "${IMAGE_REPO}@${{ needs.build-loong64.outputs.dev_digest }}"
        docker buildx imagetools inspect "${IMAGE_REPO}:${REX_DEV_TAG}"
