name: Nightly REX Images

on:
  schedule:
    # Every day at 08:00 UTC (01:00 PDT)
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-rex-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-riscv64:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      runtime_digest: ${{ steps.build-runtime.outputs.digest }}
      dev_digest: ${{ steps.build-dev.outputs.digest }}

    defaults:
      run:
        shell: bash

    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
      LOCAL_IMAGE_REPO: rex-local
      REX_RUNTIME_TAG: latest
      REX_DEV_TAG: dev
      REX_IMAGE_BUILD_JOBS: 4
      TARGET_ARCH: riscv64
      TARGET_PLATFORM: linux/riscv64

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Set up QEMU (${{ env.TARGET_ARCH }})
      uses: docker/setup-qemu-action@v4
      with:
        platforms: ${{ env.TARGET_ARCH }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      if: ${{ !env.ACT }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push REX runtime image (${{ env.TARGET_ARCH }})
      if: ${{ !env.ACT }}
      id: build-runtime
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: ${{ env.TARGET_PLATFORM }}
        target: runtime
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build REX runtime image locally (${{ env.TARGET_ARCH }})
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: ${{ env.TARGET_PLATFORM }}
        target: runtime
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:runtime-${{ env.TARGET_ARCH }}-local

    - name: Build and push REX dev image (${{ env.TARGET_ARCH }})
      if: ${{ !env.ACT }}
      id: build-dev
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: ${{ env.TARGET_PLATFORM }}
        target: test
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build REX dev image locally (${{ env.TARGET_ARCH }})
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: ${{ env.TARGET_PLATFORM }}
        target: test
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:dev-${{ env.TARGET_ARCH }}-local

  build-loong64:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      runtime_digest: ${{ steps.build-runtime.outputs.digest }}
      dev_digest: ${{ steps.build-dev.outputs.digest }}

    defaults:
      run:
        shell: bash

    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
      LOCAL_IMAGE_REPO: rex-local
      REX_RUNTIME_TAG: latest
      REX_DEV_TAG: dev
      REX_IMAGE_BUILD_JOBS: 4
      TARGET_ARCH: loong64
      TARGET_PLATFORM: linux/loong64

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Set up QEMU (${{ env.TARGET_ARCH }})
      uses: docker/setup-qemu-action@v4
      with:
        platforms: ${{ env.TARGET_ARCH }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      if: ${{ !env.ACT }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push REX runtime image (${{ env.TARGET_ARCH }})
      if: ${{ !env.ACT }}
      id: build-runtime
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: ${{ env.TARGET_PLATFORM }}
        target: runtime
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build REX runtime image locally (${{ env.TARGET_ARCH }})
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: ${{ env.TARGET_PLATFORM }}
        target: runtime
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:runtime-${{ env.TARGET_ARCH }}-local

    - name: Build and push REX dev image (${{ env.TARGET_ARCH }})
      if: ${{ !env.ACT }}
      id: build-dev
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: ${{ env.TARGET_PLATFORM }}
        target: test
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}
        outputs: type=registry,name=${{ env.IMAGE_REPO }},push-by-digest=true

    - name: Build REX dev image locally (${{ env.TARGET_ARCH }})
      if: ${{ env.ACT }}
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ci/docker/rex-nightly.Dockerfile
        platforms: ${{ env.TARGET_PLATFORM }}
        target: test
        pull: true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_REPO }}:base
          REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}
        load: true
        tags: ${{ env.LOCAL_IMAGE_REPO }}:dev-${{ env.TARGET_ARCH }}-local

  publish-manifests:
    runs-on: ubuntu-26.04
    needs:
    - build-riscv64
    - build-loong64
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: bash

    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
      REX_RUNTIME_TAG: latest
      REX_DEV_TAG: dev

    steps:
    - name: Set up Docker Buildx
      if: ${{ !env.ACT }}
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      if: ${{ !env.ACT }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish multi-arch runtime manifest (latest tag)
      if: ${{ !env.ACT }}
      run: |
        set -euo pipefail
        docker buildx imagetools create \
          -t "${IMAGE_REPO}:${REX_RUNTIME_TAG}" \
          "${IMAGE_REPO}@${{ needs.build-riscv64.outputs.runtime_digest }}" \
          "${IMAGE_REPO}@${{ needs.build-loong64.outputs.runtime_digest }}"
        docker buildx imagetools inspect "${IMAGE_REPO}:${REX_RUNTIME_TAG}"

    - name: Publish multi-arch dev manifest (dev tag)
      if: ${{ !env.ACT }}
      run: |
        set -euo pipefail
        docker buildx imagetools create \
          -t "${IMAGE_REPO}:${REX_DEV_TAG}" \
          "${IMAGE_REPO}@${{ needs.build-riscv64.outputs.dev_digest }}" \
          "${IMAGE_REPO}@${{ needs.build-loong64.outputs.dev_digest }}"
        docker buildx imagetools inspect "${IMAGE_REPO}:${REX_DEV_TAG}"
