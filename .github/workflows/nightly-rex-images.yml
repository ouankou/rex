name: Nightly REX Images

on:
  schedule:
    - cron: "18 9 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-rex-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rex
  LOCAL_IMAGE_REPO: rex-local
  REX_IMAGE_BUILD_JOBS: 4

jobs:
  base:
    name: Resolve base image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      definition: ${{ steps.resolve.outputs.definition }}
      published: ${{ steps.resolve.outputs.published }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image must build on the base produced from this checkout's base
      # definition. Local act runs use the developer's local base images.
      - name: Resolve base definition
        id: resolve
        run: |
          definition="$(ci/docker/base-definition.sh)"
          echo "definition=${definition}" >> "$GITHUB_OUTPUT"
          if [ -n "${ACT:-}" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif output="$(docker buildx imagetools inspect "${IMAGE_REPO}:base-${definition}" 2>&1)"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "${output}" | grep -q 'not found'; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${output}" >&2
            exit 1
          fi

  build-base:
    name: Build base images
    needs: base
    if: ${{ needs.base.outputs.published != 'true' }}
    uses: ./.github/workflows/weekly-base-images.yml
    permissions:
      contents: read
      packages: write

  build:
    name: Build ${{ matrix.arch }} images
    needs: [base, build-base]
    if: ${{ !cancelled() && needs.base.result == 'success' && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, riscv64, loong64]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up QEMU
        if: ${{ matrix.arch != 'amd64' && (matrix.arch != 'arm64' || env.ACT) }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.arch }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build development image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ env.ACT && 'default' || '' }}
          context: .
          file: ci/docker/rex-nightly.Dockerfile
          platforms: linux/${{ matrix.arch }}
          target: test
          pull: ${{ !env.ACT }}
          push: ${{ !env.ACT }}
          load: ${{ env.ACT != '' }}
          provenance: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.ACT && format('{0}:dev-{1}-local', env.LOCAL_IMAGE_REPO, matrix.arch) || format('{0}:dev-{1}-{2}', env.IMAGE_REPO, github.sha, matrix.arch) }}
          build-args: |
            BASE_IMAGE=${{ env.ACT && format('{0}:base-{1}-local', env.LOCAL_IMAGE_REPO, matrix.arch) || format('{0}:base-{1}', env.IMAGE_REPO, needs.base.outputs.definition) }}
            REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ env.ACT && 'default' || '' }}
          context: .
          file: ci/docker/rex-nightly.Dockerfile
          platforms: linux/${{ matrix.arch }}
          target: runtime
          pull: ${{ !env.ACT }}
          push: ${{ !env.ACT }}
          load: ${{ env.ACT != '' }}
          provenance: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.ACT && format('{0}:runtime-{1}-local', env.LOCAL_IMAGE_REPO, matrix.arch) || format('{0}:runtime-{1}-{2}', env.IMAGE_REPO, github.sha, matrix.arch) }}
          build-args: |
            BASE_IMAGE=${{ env.ACT && format('{0}:base-{1}-local', env.LOCAL_IMAGE_REPO, matrix.arch) || format('{0}:base-{1}', env.IMAGE_REPO, needs.base.outputs.definition) }}
            REX_BUILD_NUM_JOBS=${{ env.REX_IMAGE_BUILD_JOBS }}

  publish:
    name: Publish multi-architecture manifests
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      packages: write

    steps:
      - if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifests
        if: ${{ !env.ACT }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:latest" \
            -t "${IMAGE_REPO}:latest-${GITHUB_SHA}" \
            "${IMAGE_REPO}:runtime-${GITHUB_SHA}-amd64" \
            "${IMAGE_REPO}:runtime-${GITHUB_SHA}-arm64" \
            "${IMAGE_REPO}:runtime-${GITHUB_SHA}-riscv64" \
            "${IMAGE_REPO}:runtime-${GITHUB_SHA}-loong64"

          docker buildx imagetools create \
            -t "${IMAGE_REPO}:dev" \
            -t "${IMAGE_REPO}:dev-${GITHUB_SHA}" \
            "${IMAGE_REPO}:dev-${GITHUB_SHA}-amd64" \
            "${IMAGE_REPO}:dev-${GITHUB_SHA}-arm64" \
            "${IMAGE_REPO}:dev-${GITHUB_SHA}-riscv64" \
            "${IMAGE_REPO}:dev-${GITHUB_SHA}-loong64"

  test:
    name: Test published images
    needs: publish
    uses: ./.github/workflows/ci-nightly.yml
    permissions:
      packages: read
