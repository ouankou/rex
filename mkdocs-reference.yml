site_name: REX API Reference
site_dir: _site/reference
docs_dir: docs/reference
nav:
  - API Index: index.md
  - Namespaces: sections/namespaces.md
  - Types: sections/types.md
  - Type Aliases: sections/type-aliases.md
  - Enums: sections/enums.md
  - Functions: sections/functions.md
  - Variables: sections/variables.md
  - Using Declarations: sections/using-declarations.md
  - Using Namespace Directives: sections/using-namespace-directives.md

not_in_nav: |
  **/*.md
  !/index.md
  !/sections/*.md

theme:
  name: material
  features:
    - navigation.top
    - navigation.tabs

hooks:
  - docs/mkdocs-search-exclude.py

plugins:
  - material/search:
      separator: "[\\s\\-_:]+"

markdown_extensions:
  - tables
  - toc:
      permalink: true
