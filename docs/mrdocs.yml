# yaml-language-server: $schema=https://raw.githubusercontent.com/cppalliance/mrdocs/develop/docs/mrdocs.schema.json
source-root: ..
input:
  - ../src
recursive: true
exclude:
  - ../src/frontend/SageIII/ompparser
  - ../src/frontend/SageIII/accparser
  - ../src/ROSETTA
exclude-patterns:
  - "*/tests/*"
  - "*/external/*"
  - "*/third_party/*"
  - "*/3rdPartyLibraries/*"
  - "docs/_build/*"
  - "*/.git/*"
  - "src/util/nlohmann/*"
file-patterns:
  - '*.h'
  - '*.hh'
  - '*.hpp'
  - '*.hxx'
  - '*.H'
  - '*.inl'
  - '*.ipp'
  - '*.tpp'
  - '*.tcc'
generator: adoc
output: reference
multipage: true
inherit-base-members: never
auto-function-metadata: true
extract-private: true
# Use the runner toolchain's C and C++ headers. The generated include overlay
# strips known unsupported HTML doc-comment tags without crossing line
# boundaries, so system declarations are not rewritten.
use-system-libc: true
use-system-stdlib: true
warnings: true
warn-no-paramdoc: false
warn-if-undoc-enum-val: false
