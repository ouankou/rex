[project]
site_name = "REX Documentation"
site_description = "Compiler source, build notes and API reference for REX."
site_url = "https://rex.ouankou.com/docs/"
docs_dir = "docs"
site_dir = "_site"
extra_css = ["stylesheets/reference.css"]
extra_javascript = ["javascripts/reference-table-sizing.js", "javascripts/api-lookup.js"]
exclude_docs = "mrdocs-addons/**\noverrides/**"
not_in_nav = """
reference/**/*.md
!reference/index.md
!reference/sections/*.md
"""
nav = [
  { "Developer workspace" = "index.md" },
  { API = [
    { Overview = "api.md" },
    { "Symbol lookup" = "api-lookup.md" },
    { "Reference index" = "reference/index.md" },
    { Namespaces = "reference/sections/namespaces.md" },
    { Types = "reference/sections/types.md" },
    { Functions = "reference/sections/functions.md" },
    { "Type Aliases" = "reference/sections/type-aliases.md" },
    { Enums = "reference/sections/enums.md" },
    { Variables = "reference/sections/variables.md" },
    { "Using Declarations" = "reference/sections/using-declarations.md" },
    { "Using Namespace Directives" = "reference/sections/using-namespace-directives.md" },
  ] },
  { "Developer guides" = [
    { "Build REX" = "build.md" },
    { "Build documentation" = "documentation.md" },
    { "Clang OpenMP" = "clang-openmp-notes.md" },
    { "Memory tooling" = "REX_MEMORY_TOOLING.md" },
    { "Upstream sync" = "upstream-sync/rose-upstream-sync-guide.md" },
  ] },
]

[project.theme]
variant = "classic"
custom_dir = "docs/overrides"
features = [
  "navigation.top",
  "navigation.sections",
  "toc.integrate",
  "navigation.path",
  "toc.follow",
  "content.code.copy",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.tabbed" = { alternate_style = true }
tables = {}
toc = { permalink = true }

[project.plugins.minify]
minify_html = true
